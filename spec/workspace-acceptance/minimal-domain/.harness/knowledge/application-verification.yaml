version: 1
kind: harness-knowledge-artifact
artifact: APPLICATION-VERIFICATION
schema: verification-plan/v1
title: Application Verification Strategy

content:
  purpose: Define how accepted application requirements and semantics are checked before implementation changes are accepted.
  scope: Application product requirement and domain behavior.
  checks:
    - id: VER-COMPONENT-UNIQUENESS
      objective: Verify that an Application cannot contain the same Component more than once.
      verifies:
        - REQ-APPLICATION-COMPONENT-UNIQUE
        - APPLICATION-COMPONENT-UNIQUE
      method: TEST
      evidence:
        - Executable test contract covering duplicate component membership.
    - id: VER-CANONICAL-GENERATION
      objective: Verify that generated human documentation remains synchronized with canonical knowledge.
      verifies:
        - APPLICATION-COMPONENT-UNIQUE
      method: INSPECTION
      evidence:
        - Re-render generated documentation and require a clean diff.
  out_of_scope:
    - Performance benchmarking.
