version: 1
kind: harness-decision-exploration-contract
id: decision-exploration/v1
status: experimental

purpose: >-
  Define pre-choice option-formation evidence that required decision axes were
  actively challenged and critically reviewed before a candidate solution was
  selected. Exploration discovers alternative classes; it does not choose, rank
  or disposition them.

applicability: [APPLICABLE, NOT_APPLICABLE, UNRESOLVED]
exploration_levels: [LOCAL, EXPLORE, RESEARCH, DEEP_RESEARCH]

rules:
  - Exploration is a separate input to semantic admission and precedes candidate choice.
  - Exploration evidence must not contain selected, preferred, chosen or disposition fields.
  - There is no NO_MATERIAL_DECISION escape hatch.
  - An APPLICABLE axis must expose at least one discovered decision point.
  - EXPLORE and deeper require at least two materially distinct alternatives per decision point.
  - Material distinction is expressed through knowledge-kind-specific material dimensions.
  - Required challenge strategies are knowledge-kind-specific and multiple independent probes are required at EXPLORE and deeper.
  - NOT_APPLICABLE requires accepted canonical artifact evidence; free-text rationale is insufficient.
  - UNRESOLVED applicability fails admission and must be resolved or routed through the owning Authority.
  - RESEARCH and DEEP_RESEARCH add external evidence obligations.
  - Exploration demonstrates process sufficiency, not exhaustive enumeration of every possible solution.
  - Before choice, decision_space_review must be COMPLETE and cover every discovered decision point.
  - decision_space_review must check mixed-decision splitting, missing material cases, the impact-and-reversal materiality frontier, accepted constraints and Authority boundaries.
  - The impact-and-reversal frontier review searches beyond already-discovered decision points for reasonably discoverable choices with high semantic impact, blast radius, reversal cost or primary-task impact.
  - A frontier choice with any high criterion must become an explicit decision point, be routed/escalated, or remain an open material gap; local cheap reversible choices that do not materially affect semantics or task success remain downstream freedom.
  - Any open material gap rejects option formation and must be fixed locally or routed as a normal Core Question when it is a semantic unknown.

non_goals:
  - select a preferred solution
  - decide viability against all constraints
  - replace Authority ownership
  - create Core state
