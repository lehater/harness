version: 1
kind: harness-knowledge-kind-decision-contracts
id: knowledge-kind-decision-contracts/v1
status: experimental

policy_defaults:
  exploration: EXPLORE
  autonomy: CONSERVATIVE

contracts:
  - knowledge_kind: domain-model
    required: true
    minimum_exploration: EXPLORE
    axes:
      - id: semantic-identity
        delegation_requires: MAXIMUM
        minimum_probes: 2
        material_dimensions: [identity-basis, continuity, merge-split]
        challenge_strategies: [identity-substitution, merge-vs-split, lifecycle-perturbation]
      - id: invariants
        delegation_requires: MAXIMUM
        minimum_probes: 2
        material_dimensions: [valid-state-space, enforcement-owner, exception-policy]
        challenge_strategies: [relax-invariant, strengthen-invariant, move-enforcement-owner]
      - id: lifecycle
        delegation_requires: MAXIMUM
        minimum_probes: 2
        material_dimensions: [state-set, transition-ownership, terminality]
        challenge_strategies: [state-split, state-merge, transition-perturbation]
      - id: relationships
        delegation_requires: BROAD
        minimum_probes: 2
        material_dimensions: [relation-vs-entity, directionality, cardinality]
        challenge_strategies: [entity-vs-relation, reverse-direction, cardinality-perturbation]
      - id: responsibility-boundaries
        delegation_requires: MAXIMUM
        minimum_probes: 2
        material_dimensions: [semantic-owner, boundary-placement, downstream-freedom]
        challenge_strategies: [move-owner-upstream, move-owner-downstream, split-responsibility]

  - knowledge_kind: application-design
    required: true
    minimum_exploration: EXPLORE
    axes:
      - id: operation-boundaries
        delegation_requires: BROAD
        minimum_probes: 2
        material_dimensions: [operation-granularity, mutation-owner, query-write-split]
        challenge_strategies: [split-operation, merge-operations, command-query-perturbation]
      - id: orchestration
        delegation_requires: BROAD
        minimum_probes: 2
        material_dimensions: [orchestration-owner, ordering, sync-async]
        challenge_strategies: [move-orchestrator, reorder-steps, sync-vs-async]
      - id: failure-semantics
        delegation_requires: MAXIMUM
        minimum_probes: 2
        material_dimensions: [failure-classification, recovery-owner, retry-policy]
        challenge_strategies: [fail-vs-recover, retry-vs-no-retry, move-recovery-owner]
      - id: partial-results
        delegation_requires: MAXIMUM
        minimum_probes: 2
        material_dimensions: [all-or-nothing, partial-validity, continuation]
        challenge_strategies: [all-or-nothing-vs-partial, drop-partial-result, resumability-perturbation]
      - id: continuation-currentness
        delegation_requires: MAXIMUM
        minimum_probes: 2
        material_dimensions: [snapshot-vs-live, staleness-policy, continuation-token]
        challenge_strategies: [recompute-vs-materialize, stale-vs-refresh, continuation-token-perturbation]

  - knowledge_kind: application-process-design
    required: true
    minimum_exploration: EXPLORE
    axes:
      - id: occurrence-boundary
        delegation_requires: BROAD
        minimum_probes: 2
        material_dimensions: [scope, entry, occurrence-identity, completion-boundary]
        challenge_strategies: [narrow-vs-widen-scope, merge-vs-split-occurrence, entry-boundary-perturbation]
      - id: composition
        delegation_requires: BROAD
        minimum_probes: 2
        material_dimensions: [ordering, choice, concurrency, decomposition]
        challenge_strategies: [reorder-constraints, imperative-vs-declarative, split-vs-compose]
      - id: continuation
        delegation_requires: MAXIMUM
        minimum_probes: 2
        material_dimensions: [wait-condition, continuation-identity, correlation-semantics]
        challenge_strategies: [wait-vs-no-wait, continuation-identity-perturbation, correlation-boundary-shift]
      - id: completion-recovery
        delegation_requires: MAXIMUM
        minimum_probes: 2
        material_dimensions: [completion-outcomes, cancellation, recovery, compensation]
        challenge_strategies: [completion-outcome-perturbation, recover-vs-terminate, compensate-vs-no-compensation]

  - knowledge_kind: system-architecture
    required: true
    minimum_exploration: EXPLORE
    axes:
      - id: runtime-boundaries
        delegation_requires: BROAD
        minimum_probes: 2
        material_dimensions: [runtime-count, process-boundary, independent-deployment]
        challenge_strategies: [merge-vs-split, boundary-shift, independent-deployment-perturbation]
      - id: deployment-topology
        delegation_requires: BROAD
        minimum_probes: 2
        material_dimensions: [deployable-count, colocation, scaling-boundary]
        challenge_strategies: [co-locate-vs-separate, scaling-perturbation, deployment-boundary-shift]
      - id: interaction-model
        delegation_requires: BROAD
        minimum_probes: 2
        material_dimensions: [sync-async, protocol-boundary, coupling]
        challenge_strategies: [sync-vs-async, adapter-substitution, transport-boundary-shift]
      - id: state-placement
        delegation_requires: BROAD
        minimum_probes: 2
        material_dimensions: [source-of-truth, state-locality, replication]
        challenge_strategies: [move-source-of-truth, cache-vs-canonical, replication-perturbation]
      - id: dependency-direction
        delegation_requires: BROAD
        minimum_probes: 2
        material_dimensions: [dependency-owner, inversion-boundary, framework-coupling]
        challenge_strategies: [reverse-dependency, invert-port, framework-coupling-perturbation]
      - id: failure-isolation
        delegation_requires: BROAD
        minimum_probes: 2
        material_dimensions: [failure-domain, containment-boundary, fallback]
        challenge_strategies: [collapse-failure-boundary, isolate-failure-boundary, dependency-outage-perturbation]

  - knowledge_kind: interface-topology-design
    required: true
    minimum_exploration: EXPLORE
    axes:
      - id: view-boundaries
        delegation_requires: CONSERVATIVE
        minimum_probes: 2
        material_dimensions:
          - goal-continuity
          - information-dependency
          - working-state-continuity
          - commit-recovery-boundary
          - mode-authority-boundary
          - independent-addressability
        challenge_strategies:
          - merge-vs-separate-view
          - persistent-context-vs-navigation
          - contextual-surface-vs-destination

  - knowledge_kind: presentation-system-design
    required: true
    minimum_exploration: EXPLORE
    axes:
      - id: application-surface
        delegation_requires: CONSERVATIVE
        minimum_probes: 2
        material_dimensions: [surface-archetype, viewport-ownership, navigation-persistence, overflow-ownership]
        challenge_strategies: [document-vs-bounded-workspace, workspace-vs-step-flow, page-scroll-vs-region-overflow, persistent-vs-contextual-navigation]
      - id: knowledge-representation
        delegation_requires: CONSERVATIVE
        minimum_probes: 2
        material_dimensions: [representation-form, spatial-dimensionality, relation-encoding]
        challenge_strategies: [graph-vs-nongraph, 2d-vs-3d, single-vs-mixed]
      - id: information-density
        delegation_requires: CONSERVATIVE
        minimum_probes: 2
        material_dimensions: [simultaneous-context, detail-disclosure, label-density]
        challenge_strategies: [dense-vs-progressive, focus-context-shift, always-visible-vs-on-demand]
      - id: control-surface
        delegation_requires: CONSERVATIVE
        minimum_probes: 2
        material_dimensions: [control-persistence, direct-manipulation, keyboard-equivalence]
        challenge_strategies: [inline-vs-dedicated-controls, direct-manipulation-vs-command, pointer-vs-keyboard]

  - knowledge_kind: screen-view-design
    required: true
    minimum_exploration: EXPLORE
    axes:
      - id: view-composition
        delegation_requires: CONSERVATIVE
        minimum_probes: 2
        material_dimensions: [primary-region, secondary-context, task-colocation]
        challenge_strategies: [region-vs-pane, co-locate-vs-disclose, region-priority-shift]
      - id: detail-edit-placement
        delegation_requires: CONSERVATIVE
        minimum_probes: 2
        material_dimensions: [detail-placement, edit-placement, context-preservation]
        challenge_strategies: [inline-vs-overlay, local-detail-vs-disclosure, context-preservation-perturbation]
      - id: responsive-composition
        delegation_requires: CONSERVATIVE
        minimum_probes: 2
        material_dimensions: [narrow-layout, disclosure, projection-priority]
        challenge_strategies: [collapse-vs-reflow, persistent-vs-disclosed, primary-surface-perturbation]

  - knowledge_kind: component-design
    required: true
    minimum_exploration: EXPLORE
    axes:
      - id: responsibility-boundaries
        delegation_requires: CONSERVATIVE
        minimum_probes: 2
        material_dimensions: [boundary-granularity, ownership-basis, cross-feature-sharing]
        challenge_strategies: [split-vs-merge, feature-vs-technical, local-vs-shared]
      - id: provider-seams
        delegation_requires: CONSERVATIVE
        minimum_probes: 2
        material_dimensions: [seam-location, provider-leakage, substitution-scope]
        challenge_strategies: [direct-vs-port, wrapper-scope-perturbation, provider-substitution]
      - id: state-ownership
        delegation_requires: CONSERVATIVE
        minimum_probes: 2
        material_dimensions: [state-owner, sharing-scope, lifecycle]
        challenge_strategies: [local-vs-global, server-vs-client-owner, lifecycle-perturbation]

  - knowledge_kind: implementation-design
    required: true
    minimum_exploration: EXPLORE
    axes:
      - id: slice-boundaries
        delegation_requires: CONSERVATIVE
        minimum_probes: 2
        material_dimensions: [slice-granularity, dependency-order, ownership-alignment]
        challenge_strategies: [split-slice, merge-slices, dependency-order-perturbation]
      - id: repository-realization
        delegation_requires: CONSERVATIVE
        minimum_probes: 2
        material_dimensions: [module-boundary, composition-root, generated-source-placement]
        challenge_strategies: [boundary-remap, composition-root-shift, generated-source-perturbation]
      - id: dependency-tooling
        delegation_requires: BROAD
        minimum_probes: 2
        material_dimensions: [tool-family, enforcement-point, runtime-footprint]
        challenge_strategies: [tool-substitution, enforcement-point-shift, remove-tool]
      - id: migration-transition
        delegation_requires: MAXIMUM
        minimum_probes: 2
        material_dimensions: [transition-mode, rollback, compatibility]
        challenge_strategies: [in-place-vs-parallel, rollback-perturbation, compatibility-window]
      - id: verification-enforcement
        delegation_requires: BROAD
        minimum_probes: 2
        material_dimensions: [verification-layer, automation-boundary, failure-gate]
        challenge_strategies: [move-verification-layer, manual-vs-automated, gate-failure-perturbation]
      - id: delivery-gates
        delegation_requires: BROAD
        minimum_probes: 2
        material_dimensions: [gate-location, authority, reproducibility]
        challenge_strategies: [local-vs-ci, gate-owner-shift, reproducibility-perturbation]
