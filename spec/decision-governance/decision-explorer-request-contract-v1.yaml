version: 1
kind: harness-decision-explorer-request-contract
id: decision-explorer-request/v1
status: experimental

purpose: >-
  Define the Harness-generated pre-choice input manifest for Decision
  Exploration. The request binds option-formation evidence to the exact accepted
  baseline, decision contract and exploration policy that existed before future
  candidate production.

rules:
  - The request is generated by Harness from Engineering Graph/Core/lifecycle context.
  - CREATE contains accepted prerequisite/support artifact manifests and no future candidate/write-target content.
  - REVISION/REDO also contains the current accepted provider as CURRENT_ACCEPTED_BASELINE.
  - The future candidate, decision_review, preferred/selected solution and write set are forbidden pre-choice inputs.
  - The request identity is a deterministic hash of its pre-exploration payload.
  - Exploration evidence must reference the exact request identity accepted by semantic admission.
  - A policy or accepted-prerequisite baseline change produces a different request identity.
  - Questions created while reviewing/choosing are outputs and do not retroactively alter the request.
  - Request binding proves the authorized input manifest, not physical model-context isolation.

residual_risk:
  - A runtime that ignores the request and leaks candidate/preferred-solution context cannot be detected by schema validation alone.
  - Physical isolation requires an orchestrator/runtime boundary outside Core.
