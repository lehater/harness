version: 1
kind: harness-authority-role-contract
id: engineering-authority-roles/v1-research
status: research

# Roles define responsibility/competence, not mandatory work.
# A semantic claim becomes required only when an activated concern needs it.
roles:
  product:
    can_produce_claims:
      - engineering.intent.problem
      - engineering.intent.scope
      - engineering.intent.behavior
      - engineering.intent.quality-targets

  domain:
    can_produce_claims:
      - engineering.domain.model
      - engineering.domain.boundaries
      - engineering.domain.invariants
      - engineering.domain.time
      - engineering.domain.provenance

  application:
    can_produce_claims:
      - engineering.application.use-cases
      - engineering.application.orchestration
      - engineering.application.failures

  architecture:
    can_produce_claims:
      - engineering.architecture.structure
      - engineering.architecture.boundaries
      - engineering.architecture.communication
      - engineering.architecture.deployment
      - engineering.architecture.decisions

  interface:
    can_produce_claims:
      - engineering.interface.machine.contract
      - engineering.interface.machine.errors
      - engineering.interface.machine.compatibility
      - engineering.interface.human.journeys
      - engineering.interface.human.usability
      - engineering.interface.human.accessibility
      - engineering.interface.human.responsiveness
      - engineering.interface.human.i18n

  data:
    can_produce_claims:
      - engineering.data.model
      - engineering.data.integrity
      - engineering.data.lifecycle
      - engineering.data.quality
      - engineering.data.provenance
      - engineering.data.reproducibility
      - engineering.data.classification
      - engineering.reliability.durability
      - engineering.governance.data

  security-architecture:
    can_produce_claims:
      - engineering.security.boundaries
      - engineering.security.identity
      - engineering.security.authorization
      - engineering.security.confidentiality
      - engineering.security.integrity
      - engineering.security.accountability
      - engineering.security.availability-abuse

  security-analysis:
    can_produce_claims:
      - engineering.security.threat-analysis
      - engineering.security.vulnerability-management
      - engineering.security.secure-development

  reliability:
    can_produce_claims:
      - engineering.reliability.failure-semantics
      - engineering.reliability.availability
      - engineering.reliability.fault-tolerance
      - engineering.reliability.recovery
      - engineering.reliability.consistency
      - engineering.reliability.retry-idempotency
      - engineering.reliability.durability
      - engineering.reliability.dependency-failure

  operability:
    can_produce_claims:
      - engineering.operability.configuration
      - engineering.operability.logging
      - engineering.operability.metrics
      - engineering.operability.tracing
      - engineering.operability.health
      - engineering.operability.alerting
      - engineering.operability.incident
      - engineering.operability.admin
      - engineering.operability.capacity

  verification:
    can_produce_claims:
      - engineering.verification.strategy
      - engineering.verification.requirement-traceability
      - engineering.verification.functional
      - engineering.verification.quality
      - engineering.verification.security
      - engineering.verification.reliability
      - engineering.verification.interface.machine
      - engineering.verification.interface.human
      - engineering.verification.architecture
      - engineering.verification.data
      - engineering.transition.revalidation

  engineering:
    can_produce_claims:
      - engineering.engineering.principles
      - engineering.engineering.components
      - engineering.engineering.error-handling
      - engineering.engineering.time
      - engineering.engineering.configuration
      - engineering.engineering.code-quality
      - engineering.quality.maintainability.modularity
      - engineering.quality.maintainability.analysability
      - engineering.quality.maintainability.modifiability
      - engineering.quality.maintainability.testability

  dependency:
    can_produce_claims:
      - engineering.dependency.inventory
      - engineering.dependency.trust
      - engineering.dependency.versioning
      - engineering.dependency.license
      - engineering.dependency.vulnerability

  delivery:
    can_produce_claims:
      - engineering.delivery.reproducible-build
      - engineering.delivery.provenance
      - engineering.delivery.integrity
      - engineering.delivery.release
      - engineering.delivery.migration
      - engineering.delivery.rollback

  governance:
    can_produce_claims:
      - engineering.governance.external-obligations
      - engineering.governance.privacy
      - engineering.governance.data
      - engineering.governance.audit
      - engineering.governance.ownership

  quality:
    can_produce_claims:
      - engineering.quality.performance.latency
      - engineering.quality.performance.throughput
      - engineering.quality.performance.resource-efficiency
      - engineering.quality.performance.capacity
      - engineering.quality.compatibility.interoperability
      - engineering.quality.compatibility.coexistence
      - engineering.quality.maintainability.modularity
      - engineering.quality.maintainability.reusability
      - engineering.quality.maintainability.analysability
      - engineering.quality.maintainability.modifiability
      - engineering.quality.maintainability.testability
      - engineering.quality.flexibility.adaptability
      - engineering.quality.flexibility.scalability
      - engineering.quality.flexibility.installability
      - engineering.quality.flexibility.replaceability

  transition:
    can_produce_claims:
      - engineering.transition.compatibility
      - engineering.transition.data-migration
      - engineering.transition.rollout
      - engineering.transition.deprecation
      - engineering.transition.revalidation
