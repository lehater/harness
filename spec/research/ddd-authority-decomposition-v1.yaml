knowledge_flows:
  - producer: domain-strategy
    output: domain.landscape
    consumer: model-context-strategy
    consumer_output: domain.context-boundaries
    necessity: Context boundary design needs accepted problem-space responsibilities when non-trivial domain decomposition exists.
    encapsulation: Context design consumes the landscape but owns model/language applicability rather than subdomain identity.
  - producer: model-context-strategy
    output: domain.context-boundaries
    consumer: tactical-domain-model
    consumer_output: domain.tactical-model
    necessity: Tactical semantics require a declared model/language applicability boundary in a non-trivial multi-model domain.
    encapsulation: Tactical modeling consumes the context boundary without redefining context ownership.
  - producer: tactical-domain-model
    output: domain.tactical-model
    consumer: implementation-design
    consumer_output: implementation.plan
    necessity: Implementation must realize accepted identities, invariants, events and aggregate semantics without inventing domain rules.
    encapsulation: Implementation consumes tactical semantics without owning domain meaning.

boundary_variants:
  - id: simple-one-context
    expect: PASS
    domain_strategy: optional
    subdomains: 1
    contexts: 1
    rationale: One coherent model/language may need no separately materialized strategic decomposition.
  - id: multiple-subdomains-one-context
    expect: PASS
    subdomains: 3
    contexts: 1
    rationale: Multiple problem-space responsibilities do not prove multiple model/language boundaries.
  - id: one-subdomain-multiple-contexts
    expect: PASS
    subdomains: 1
    contexts: 2
    rationale: Distinct models/languages may coexist for one business subdomain.
  - id: automatic-one-to-one
    expect: FAIL
    subdomains: 4
    contexts: 4
    rationale: one subdomain equals one bounded context
    invalid_reason_markers: ["equals", "1:1", "automatically"]
  - id: capabilities-renamed-contexts
    expect: FAIL
    contexts_source: product-capabilities
    rationale: Context names copied from product capability groups without model/language boundary evidence.
  - id: context-change-stable-domain-strategy
    expect: PASS
    domain_strategy_changed: false
    context_boundaries_changed: true
    rationale: Model boundaries can evolve independently behind a stable problem-space decomposition.
  - id: domain-strategy-change-stable-context
    expect: PASS
    domain_strategy_changed: true
    context_boundaries_changed: false
    rationale: Strategic classification can change without mechanically changing a valid model boundary.
