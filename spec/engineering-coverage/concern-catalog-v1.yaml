      - {id: intent.scope, title: Goals, scope and exclusions}
      - {id: intent.behavior, title: Required observable behavior}
      - {id: intent.quality-targets, title: Explicit quality targets and trade-offs}

  - id: domain
    title: Domain semantics
    children:
