quality_lens:
  id: quality
  title: Product/system quality
  purpose: Cross-cutting navigation lens; it does not duplicate project coverage state.
  mappings:
    functional-suitability:
      refs: [intent.behavior, verification.functional]
    performance-efficiency:
      refs: [quality.performance.latency, quality.performance.throughput, quality.performance.resource-efficiency, quality.performance.capacity]
    compatibility:
      refs: [interface.machine.compatibility, quality.compatibility.interoperability, quality.compatibility.coexistence]
    interaction-capability:
      refs: [interface.human.usability, interface.human.accessibility, interface.human.i18n]
    reliability:
      refs: [reliability.failure-semantics, reliability.availability, reliability.fault-tolerance, reliability.recovery, reliability.consistency, reliability.durability]
    security:
      refs: [security.boundaries, security.identity, security.authorization, security.confidentiality, security.integrity, security.accountability, security.availability-abuse]
    maintainability:
      refs: [quality.maintainability.modularity, quality.maintainability.analysability, quality.maintainability.modifiability, quality.maintainability.testability, quality.maintainability.reusability]
    flexibility:
      refs: [quality.flexibility.adaptability, quality.flexibility.scalability, quality.flexibility.installability, quality.flexibility.replaceability]
    safety:
      refs: [specialized.safety]

quality_attribute_leaves:
  - {id: quality.performance.latency, title: Latency/time behavior}
  - {id: quality.performance.throughput, title: Throughput}
  - {id: quality.performance.resource-efficiency, title: Resource efficiency}
  - {id: quality.performance.capacity, title: Capacity}
  - {id: quality.compatibility.interoperability, title: Interoperability}
  - {id: quality.compatibility.coexistence, title: Co-existence}
  - {id: quality.maintainability.modularity, title: Modularity}
  - {id: quality.maintainability.reusability, title: Reusability}
  - {id: quality.maintainability.analysability, title: Analysability}
  - {id: quality.maintainability.modifiability, title: Modifiability}
  - {id: quality.maintainability.testability, title: Testability}
  - {id: quality.flexibility.adaptability, title: Adaptability/portability}
  - {id: quality.flexibility.scalability, title: Scalability}
  - {id: quality.flexibility.installability, title: Installability}
  - {id: quality.flexibility.replaceability, title: Replaceability}

specializations:
  - id: specialized.safety
    activation_prompt: Can failure cause material harm to people, property or environment?
  - id: specialized.ai
    activation_prompt: Does the system contain AI/ML/agentic behavior whose uncertainty or autonomy changes risk?
  - id: specialized.distributed
    activation_prompt: Are there independent runtime nodes, asynchronous communication or distributed consistency concerns?
  - id: specialized.regulated
    activation_prompt: Do sector-specific legal/regulatory controls apply?
