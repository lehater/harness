version: 1
kind: harness-engineering-concern-catalog
id: software-engineering-concerns/v1
status: canonical

semantics:
  leaf_states: [COVERED, MISSING, BLOCKED, STALE, NOT_APPLICABLE, DEFERRED, UNASSESSED]
  aggregate_display_states: [COVERED, PARTIAL, MISSING, BLOCKED, STALE, NOT_APPLICABLE, DEFERRED, UNASSESSED]
  rules:
    - Leaf concern state is project truth only when backed by accepted project evidence or derived from accepted Harness knowledge.
    - Parent state is always derived; it is never persisted as independent truth.
    - Empty or absent mapping means UNASSESSED, never NOT_APPLICABLE.
    - A concern can map to many capabilities, authorities and artifacts.
    - File names are navigation hints, never semantic evidence.
    - Cross-cutting lenses reference canonical concern ids and never own duplicate coverage state.

concerns:
