version: 1
kind: harness-semantic-acceptance-contract
id: artifact-semantic-acceptance/v1
status: canonical

purpose: >-
  Define the minimal generated evidence boundary between candidate artifact
  production and canonical capability realization. This is not a Core entity and
  not a universal artifact ontology.

contract:
  input:
    production:
      required:
        - authority
        - capability
      optional:
        - semantic_claims
        - owned_assertion_kinds
        - obligations
        - compatibility_obligations
        - requires_semantic_review
        - required_semantic_review_checks
        - allowed_source_authorities
        - requires_source_authority
        - requires_assertion_authority
    obligations:
      fields:
        id: required
        kind: optional
        subject: optional
        subjects: optional
        min_count: optional
        required_values: optional
      rule: >-
        Artifact skills derive finite obligations from accepted upstream scope.
        Subject sets are used whenever completeness applies to multiple semantic
        instances.
    candidate_assertions:
      fields:
        id: required
        kind: required
        subject: optional
        semantic_value: optional
        derived_from: optional
        decision_authority: optional
        source_artifact: optional-for-source-assertions
      rule: >-
        Only material assertions establishing the capability need machine
        addressability. Arbitrary prose sentences do not.
    source_assertions:
      fields:
        decision_authority: conditionally-required
      rule: >-
        Use bounded accepted prerequisite closure; implementation code and legacy
        documents are not semantic authority unless explicitly selected as
        canonical inputs. When requires_source_authority is true, every referenced
        source assertion must identify its decision Authority. When
        allowed_source_authorities is non-empty, a candidate may derive semantics
        only from assertions owned by one of those Authorities. This prevents a
        downstream design decision from being promoted into upstream truth merely
        by restating it.

  evaluation:
    kind: harness-artifact-semantic-evaluation
    required:
      - artifact
      - capability
      - status
      - obligations
      - findings
      - semantic_claims
    statuses: [ACCEPTED, REJECTED]
    acceptance_rule: >-
      ACCEPTED requires all machine-addressable obligations satisfied, no
      deterministic provenance/ownership/consistency finding, and accepted
      semantic review when the production contract requires one.
    claim_rule: >-
      Only semantic claims explicitly listed under semantic_claims.accepted are
      usable as Engineering Coverage proof.

  findings:
    deterministic:
      - MISSING_OBLIGATION
      - MISSING_SUBJECTS
      - MISSING_VALUES
      - UNKNOWN_PROVENANCE
      - UNKNOWN_SOURCE_AUTHORITY
      - SOURCE_AUTHORITY_VIOLATION
      - INVENTED_ASSERTION
      - MISSING_DECISION_AUTHORITY
      - WRONG_AUTHORITY_OWNERSHIP
      - CROSS_AUTHORITY_OWNERSHIP_CONFLICT
      - SOURCE_FIDELITY_VIOLATION
      - INTERNAL_CONTRADICTION
      - CROSS_ARTIFACT_CONTRADICTION
      - INCOMPATIBLE_CONSUMER_CONTRACT
      - SEMANTIC_REVIEW_REQUIRED
      - SEMANTIC_REVIEW_CHECKS_MISSING
      - SEMANTIC_REVIEW_REJECTED

integration:
  legacy_mode: >-
    A capability with no semantic-evaluation evidence may retain pre-existing
    structural realization behavior during migration, but it cannot satisfy the
    strict semantic/currentness closure used to claim full engineering closure.
  opt_in_rule: >-
    Once evaluation evidence exists for an artifact/capability, REJECTED evidence
    prevents that provider from realizing the capability.
  invalidation_rule: >-
    A semantically invalid capability invalidates dependent produced capabilities
    through Engineering Graph prerequisites until revalidation succeeds.
  authority_direction_rule: >-
    When an artifact production contract opts into source-Authority checking,
    unknown or disallowed source ownership rejects the candidate capability.
    Stakeholder confirmation does not change which Authority owns the meaning of
    a statement; a downstream decision must stay downstream unless Product
    Requirements independently accepts an observable product choice.
  strict_admission_rule: >-
    Routed artifact production must use the strict semantic-admission path when
    full engineering closure is claimed. That path derives admissible source
    Authorities from Engineering Graph prerequisites, validates canonical
    read/write provenance, requires the knowledge-kind semantic review contract,
    composes the Harness-generated candidate-free Decision Explorer Request,
    request-bound pre-choice Decision Exploration and Decision Governance for
    participating knowledge kinds, and records a capability acceptance identity
    plus prerequisite baseline.
  decision_governance_rule: >-
    When a target project supplies a decision policy and a knowledge kind has a
    required decision contract, admission fails closed unless exploration is
    bound to the exact Harness-generated Explorer Request and both exploration
    and governance are accepted. Exploration proves the required search protocol
    over a candidate-free authorized input manifest; governance proves Authority
    and autonomy disposition over exactly that explored alternative set. Neither
    proves exhaustive discovery of every possible solution or physical LLM
    context isolation. Unresolved non-delegated decisions remain Core Questions.
  coverage_rule: >-
    Engineering Coverage may use a semantic claim only from an ACCEPTED
    evaluation that explicitly accepts that claim.
  core_rule: >-
    Harness Core remains unchanged. Semantic evaluation is generated evidence
    above Core; unresolved decisions continue to be represented as Questions.

non_goals:
  - universal engineering ontology
  - formal proof of arbitrary natural-language entailment
  - independent verification of external scientific/legal/source truth
  - mandatory assertion IDs for every prose sentence
