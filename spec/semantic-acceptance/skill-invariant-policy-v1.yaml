judgement_only:
  - skill: skills/artifacts/change-transition-design/SKILL.md
    rationale: Conditional transition artifact is not currently a registered routed knowledge kind; projects must model a production contract before it can provide a capability.
  - skill: skills/artifacts/concurrency-consistency-analysis/SKILL.md
    rationale: Cross-Authority analysis routes gaps and intentionally owns no semantic capability by default.
  - skill: skills/artifacts/data-evidence-analysis/SKILL.md
    rationale: Evidence analysis is a coverage lens and intentionally does not become a semantic owner.
  - skill: skills/artifacts/data-governance-lifecycle-analysis/SKILL.md
    rationale: Analysis routes lifecycle policy decisions to existing Authorities and owns no default capability.
  - skill: skills/artifacts/external-dependency-analysis/SKILL.md
    rationale: Dependency evidence analysis is non-owning unless a project later demonstrates an independent production contract.
  - skill: skills/artifacts/human-interface-quality-analysis/SKILL.md
    rationale: Cross-Authority quality analysis routes obligations and does not own Product or Interface semantics.
  - skill: skills/artifacts/internationalization-localization-analysis/SKILL.md
    rationale: Cross-Authority localization analysis routes decisions and has no default semantic owner.
  - skill: skills/artifacts/obligation-analysis/SKILL.md
    rationale: Normative-source analysis routes constrained meaning to existing Authorities rather than owning the routed requirement.
  - skill: skills/artifacts/performance-capacity-analysis/SKILL.md
    rationale: Analysis routes targets and realization choices to Product, Quality, System, Data and Implementation.
  - skill: skills/artifacts/recovery-continuity-analysis/SKILL.md
    rationale: Analysis routes recovery semantics to existing Authorities and has no default production capability.
  - skill: skills/artifacts/reliability-analysis/SKILL.md
    rationale: Analysis intentionally does not create a generic Reliability Authority or capability.
