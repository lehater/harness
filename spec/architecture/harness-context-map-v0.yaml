version: 1
kind: harness-bounded-context-map
id: HARNESS-CONTEXT-MAP-V0
status: audit-ratchet

runtime_packages:
  - experiments
  - evals
  - distribution

semantics:
  - Bounded contexts own domain meaning; the application layer coordinates them but owns no durable engineering truth.
  - Cross-context dependencies are allowed only through the declared direction or an explicit temporary known violation.
  - Research/test modules are outside the runtime context map and may depend on production contexts, never the reverse.
  - CoreError is temporarily treated as a shared-kernel symbol until error contracts are extracted from harness.project_model.core.
  - Project Model owns the accepted project Engineering Graph; Coverage alone owns selected-scope completeness/applicability; Reference Model may propose reusable materializations but never proves completeness or mutates project truth.

contexts:
  project-model:
    kind: bounded_context
    subdomain: core
    responsibility: Own project-specific engineering knowledge topology and structural state.
    modules:
      - harness.project_model.core
      - harness.project_model.engineering_graph
      - harness.project_model.target_state
    may_depend_on: []

  reference-model:
    kind: bounded_context
    subdomain: supporting
    responsibility: Own reusable Authority types, Capability templates, applicability predicates and reference-model evolution.
    modules:
      - harness.reference_model.project_status
      - harness.reference_model.reference_materializer
      - harness.reference_model.reference_model_evolution
    may_depend_on:
      - project-model

  coverage:
    kind: bounded_context
    subdomain: core
    responsibility: Own engineering Concern applicability, subject obligations, proof requirements and completeness evaluation.
    modules:
      - harness.coverage.architecture_driver_closure
      - harness.coverage.concern_activation
      - harness.coverage.coverage_obligations
      - harness.coverage.coverage_planner
      - harness.coverage.engineering_coverage
    may_depend_on:
      - project-model
      - assurance

  assurance:
    kind: bounded_context
    subdomain: core
    responsibility: Own semantic evaluation, derivation proof, acceptance identity and capability currentness.
    modules:
      - harness.assurance.acceptance_policy
      - harness.assurance.capability_lifecycle
      - harness.assurance.derivation_test_coverage
      - harness.assurance.live_calibration
      - harness.assurance.adapters.copilot_live_calibration_evaluator
      - harness.assurance.semantic_acceptance
      - harness.assurance.semantic_derivation
      - harness.assurance.semantic_fingerprint
      - harness.assurance.semantic_judgement_calibration
    may_depend_on:
      - project-model
      - evidence

  decision:
    kind: bounded_context
    subdomain: supporting
    responsibility: Own decision-space evidence, alternatives, governance dispositions and execution assurance.
    modules:
      - harness.decision.decision_execution_assurance
      - harness.decision.decision_exploration
      - harness.decision.decision_explorer_contract
      - harness.decision.decision_governance
    may_depend_on: []

  evidence:
    kind: bounded_context
    subdomain: supporting
    responsibility: Own acquisition/source-set completeness, lossless source boundaries and statement coverage.
    modules:
      - harness.evidence.source_boundary
      - harness.evidence.source_coverage
      - harness.evidence.source_set
    may_depend_on: []

  integration:
    kind: bounded_context
    subdomain: supporting
    responsibility: Translate project-native repository state into Harness published models and validate alignment.
    modules:
      - harness.integration.integration_alignment
      - harness.integration.adapters.canonical_graph
      - harness.integration.repository_realization
    may_depend_on:
      - project-model

  workspace:
    kind: bounded_context
    subdomain: generic
    responsibility: Validate/materialize optional managed knowledge and disposable human projections.
    modules:
      - harness.workspace.dbml_projection
      - harness.workspace.frontend_interface_knowledge
      - harness.workspace.frontend_screen_contracts
      - harness.workspace.human_projection
      - harness.workspace.projection_boundary
      - harness.workspace.structurizr_projection
      - harness.workspace.workspace
    may_depend_on:
      - project-model
      - integration

  application:
    kind: application_layer
    subdomain: orchestration
    responsibility: Coordinate bounded contexts, derive next actions and translate results without owning durable domain truth.
    modules:
      - harness.application.agent_router
      - harness.application.authority_context
      - harness.application.consumer_pack
      - harness.application.coverage_application
      - harness.application.decision_explorer_request
      - harness.application.decision_pipeline
      - distribution.harnessw
      - harness.application.graph_doctor
      - harness.application.method_router
      - harness.application.project_frontier
      - harness.application.project_publication
      - harness.application.scenario_drivers
      - harness.application.scenario_suite
      - harness.application.semantic_admission
      - harness.application.semantic_closure
      - harness.application.semantic_questions
      - harness.application.skill_invariant_policy
      - harness.application.skill_router
    may_depend_on:
      - project-model
      - reference-model
      - coverage
      - assurance
      - decision
      - evidence
      - integration
      - workspace

ignored_modules:
  - evals.behavioral_eval
  - evals.adapters.copilot_behavioral_eval_agent
  - evals.greenfield_bootstrap_eval
  - evals.adapters.copilot_greenfield_bootstrap_eval_agent
  - experiments.authority_role_projection_experiment
  - experiments.concern_activation_experiment
  - experiments.coverage_control_loop_experiment
  - experiments.coverage_derivation_experiment
  - experiments.coverage_map_experiment
  - experiments.coverage_planner_experiment
  - experiments.lifecycle_experiment
  - evals.live_calibration_process_driver

published_boundaries:
  - from_context: coverage
    to_context: assurance
    modules:
      harness.assurance.semantic_acceptance:
        - coverage_assurance_view
        - coverage_invalidation_closure

  - from_context: integration
    to_context: project-model
    modules:
      harness.project_model.core:
        - CoreError
        - validate_model
      harness.project_model.engineering_graph:
        - derive_profile
        - producer_index
        - production_index
        - validate_engineering_graph

shared_kernel_imports:
  harness.project_model.core:
    - CoreError

known_violations: []
