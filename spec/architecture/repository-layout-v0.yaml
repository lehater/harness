version: 1
kind: harness-repository-layout
id: HARNESS-REPOSITORY-LAYOUT-V0
status: migration-ratchet
design: docs/design/repository-layout-v0.md
context_map: spec/architecture/harness-context-map-v0.yaml

runtime_target:
  root: src/harness
  packages:
    project-model: project_model
    reference-model: reference_model
    coverage: coverage
    assurance: assurance
    decision: decision
    evidence: evidence
    integration: integration
    workspace: workspace
    application: application

root_python:
  policy: migration-ratchet
  permanent_bootstrap_exceptions: []
  migration_baseline_modules:
    - agent_router
    - authority_context
    - authority_role_projection_experiment
    - behavioral_eval
    - concern_activation_experiment
    - consumer_pack
    - coverage_application
    - coverage_control_loop_experiment
    - coverage_derivation_experiment
    - coverage_map_experiment
    - coverage_planner_experiment
    - decision_explorer_request
    - decision_pipeline
    - graph_doctor
    - lifecycle_experiment
    - live_calibration_process_driver
    - method_router
    - project_frontier
    - project_publication
    - scenario_drivers
    - scenario_suite
    - semantic_admission
    - semantic_closure
    - semantic_questions
    - skill_invariant_policy
    - skill_router

# Finite migration state: these surfaces delegate, never own context semantics.
compatibility:
  import_aliases:
    harness:
      target: harness.project_model.core
      bridge: harness/__init__.py
  cli_facades:
    harness.py:
      target: harness.project_model.core
