version: 1
kind: harness-repository-layout
id: HARNESS-REPOSITORY-LAYOUT-V0
status: migration-ratchet
design: docs/design/repository-layout-v0.md
context_map: spec/architecture/harness-context-map-v0.yaml

runtime_target:
  root: src/harness
  packages:
    project-model: project_model
    reference-model: reference_model
    coverage: coverage
    assurance: assurance
    decision: decision
    evidence: evidence
    integration: integration
    workspace: workspace
    application: application

root_python:
  policy: migration-ratchet
  permanent_bootstrap_exceptions: []
  migration_baseline_modules:
    - acceptance_policy
    - agent_router
    - authority_context
    - authority_role_projection_experiment
    - behavioral_eval
    - capability_lifecycle
    - concern_activation_experiment
    - consumer_pack
    - coverage_application
    - coverage_control_loop_experiment
    - coverage_derivation_experiment
    - coverage_map_experiment
    - coverage_planner_experiment
    - decision_explorer_request
    - decision_pipeline
    - derivation_test_coverage
    - frontend_interface_knowledge
    - frontend_screen_contracts
    - graph_doctor
    - human_projection
    - integration_alignment
    - lifecycle_experiment
    - live_calibration
    - live_calibration_process_driver
    - method_router
    - project_frontier
    - project_publication
    - repository_realization
    - scenario_drivers
    - scenario_suite
    - semantic_acceptance
    - semantic_admission
    - semantic_closure
    - semantic_derivation
    - semantic_fingerprint
    - semantic_judgement_calibration
    - semantic_questions
    - skill_invariant_policy
    - skill_router
    - workspace

# Finite migration state: these surfaces delegate, never own context semantics.
compatibility:
  import_aliases:
    harness:
      target: harness.project_model.core
      bridge: harness/__init__.py
  cli_facades:
    harness.py:
      target: harness.project_model.core
  module_facades:
    target_state:
      target: harness.project_model.target_state
      mode: import-and-cli
    engineering_graph:
      target: harness.project_model.engineering_graph
      mode: import-and-cli
    project_status:
      target: harness.reference_model.project_status
      mode: import-and-cli
    reference_materializer:
      target: harness.reference_model.reference_materializer
      mode: import-and-cli
    reference_model_evolution:
      target: harness.reference_model.reference_model_evolution
      mode: import-only
    source_boundary:
      target: harness.evidence.source_boundary
      mode: import-and-cli
    source_coverage:
      target: harness.evidence.source_coverage
      mode: import-and-cli
    source_set:
      target: harness.evidence.source_set
      mode: import-and-cli
    decision_execution_assurance:
      target: harness.decision.decision_execution_assurance
      mode: import-only
    decision_exploration:
      target: harness.decision.decision_exploration
      mode: import-only
    decision_explorer_contract:
      target: harness.decision.decision_explorer_contract
      mode: import-only
    decision_governance:
      target: harness.decision.decision_governance
      mode: import-only
    architecture_driver_closure:
      target: harness.coverage.architecture_driver_closure
      mode: import-only
    concern_activation:
      target: harness.coverage.concern_activation
      mode: import-and-cli
    coverage_obligations:
      target: harness.coverage.coverage_obligations
      mode: import-only
    coverage_planner:
      target: harness.coverage.coverage_planner
      mode: import-and-cli
    engineering_coverage:
      target: harness.coverage.engineering_coverage
      mode: import-and-cli
