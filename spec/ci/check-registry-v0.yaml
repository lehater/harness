version: 1
kind: harness-ci-check-registry
id: HARNESS-CI-CHECKS-V0
status: active
policy: docs/design/ci-execution-policy-v0.md
stage_order:
- policy
- focused
- deferred
- exhaustive
cost_classes:
  cheap:
    nominal_seconds: <2
  medium:
    nominal_seconds: 2-10
  heavy:
    nominal_seconds: '>10'
full_gate:
  makefile_target: harness-check
  workflow: .github/workflows/harness.yml
  command: make harness-check
  policy_first_command: python validators/validate_ci_policy.py
workflow_roles:
- path: .github/workflows/ci-policy.yml
  role: focused
  cost_class: cheap
  draft_behavior: allow
- path: .github/workflows/harness.yml
  role: exhaustive
  cost_class: heavy
  draft_behavior: skip
  rationale: AUD-008 measured the full gate at about 50 seconds; never run it automatically for draft iteration.
- path: .github/workflows/greenfield-engineering-graph.yml
  role: focused
  cost_class: medium
  draft_behavior: skip
  rationale: Historical runs are about 8-15 seconds and PR path filters use cumulative PR diffs; skip automatic draft execution.
- path: .github/workflows/live-calibration-copilot.yml
  role: external
  cost_class: heavy
  draft_behavior: manual
  rationale: Provider-backed calibration has a 10 minute timeout and is intentionally operator-triggered.
- path: .github/workflows/behavioral-eval-copilot.yml
  role: external
  cost_class: heavy
  draft_behavior: manual
  rationale: Provider-backed agent judgement evidence is intentionally operator-triggered and outside ordinary PR gates.
- path: .github/workflows/behavioral-eval-copilot-tl4.yml
  role: external
  cost_class: heavy
  draft_behavior: manual
  rationale: Repeated clean-context TL4 provider evidence is intentionally isolated from the lower-level suite and operator-triggered to control cost.
- path: .github/workflows/assurance-campaign-copilot.yml
  role: external
  cost_class: heavy
  draft_behavior: manual
  rationale: Provider-backed assurance campaigns may execute multiple judgement suites in one operator-triggered run and are isolated from ordinary PR gates.


