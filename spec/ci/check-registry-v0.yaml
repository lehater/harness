version: 1
kind: harness-ci-check-registry
id: HARNESS-CI-CHECKS-V0
status: active
policy: docs/design/ci-execution-policy-v0.md
stage_order:
- policy
- focused
- deferred
- exhaustive
cost_classes:
  cheap:
    nominal_seconds: <2
  medium:
    nominal_seconds: 2-10
  heavy:
    nominal_seconds: '>10'
full_gate:
  makefile_target: harness-check
  workflow: .github/workflows/harness.yml
  command: make harness-check
  policy_first_command: python checks/validate_ci_policy.py
execution_profiles:
  fast:
    kind: deterministic
    makefile_target: assurance-fast
    command: python -m harness.assurance.execution_profiles fast
    disposition: full_gate
    stages: [policy, focused]
    cost_classes: [cheap]
    purpose: Cheap deterministic feedback for local iteration without deferred or exhaustive work.
  full:
    kind: deterministic
    makefile_target: assurance-full
    command: python -m harness.assurance.execution_profiles full
    delegate_target: harness-check
    purpose: Canonical exhaustive deterministic integration gate.
  external-release:
    kind: external
    makefile_target: assurance-external-release
    command: python -m harness.assurance.execution_profiles external-release
    preflight_profile: full
    purpose: Explicit release-time provider assurance; never part of automatic PR or push gating.
    workflow_dispatches:
      - workflow: .github/workflows/assurance-campaign-copilot.yml
        ref: main
        inputs: {campaign: all}
      - workflow: .github/workflows/greenfield-bootstrap-assurance.yml
        ref: main
        inputs: {}
      - workflow: .github/workflows/live-calibration-copilot.yml
        ref: main
        inputs: {}

workflow_roles:
- path: .github/workflows/direct-input-derivation-pilot.yml
  role: focused
  cost_class: cheap
  draft_behavior: allow
- path: .github/workflows/cdr-experimental-focused.yml
  role: focused
  cost_class: cheap
  draft_behavior: allow
  rationale: Scope-bound experimental CDR tests on Draft PRs; no full gate or external evaluator.
- path: .github/workflows/ci-policy.yml
  role: focused
  cost_class: cheap
  draft_behavior: allow
- path: .github/workflows/harness.yml
  role: exhaustive
  cost_class: heavy
  draft_behavior: skip
  rationale: AUD-008 measured the full gate at about 50 seconds; never run it automatically for draft iteration.
- path: .github/workflows/greenfield-engineering-graph.yml
  role: focused
  cost_class: medium
  draft_behavior: skip
  rationale: Historical runs are about 8-15 seconds and PR path filters use cumulative PR diffs; skip automatic draft execution.
- path: .github/workflows/greenfield-bootstrap-assurance.yml
  role: external
  cost_class: heavy
  draft_behavior: manual
  rationale: Provider-backed greenfield TL3/TL4 evidence is explicitly operator-triggered; ordinary PR integration uses deterministic gates and may leave judgement evidence stale until an external-release refresh.
- path: .github/workflows/live-calibration-copilot.yml
  role: external
  cost_class: heavy
  draft_behavior: manual
  rationale: Provider-backed calibration has a 10 minute timeout and is intentionally operator-triggered.
- path: .github/workflows/behavioral-eval-copilot.yml
  role: external
  cost_class: heavy
  draft_behavior: manual
  rationale: Provider-backed agent judgement evidence is intentionally operator-triggered and outside ordinary PR gates.
- path: .github/workflows/behavioral-eval-copilot-tl4.yml
  role: external
  cost_class: heavy
  draft_behavior: manual
  rationale: Repeated clean-context TL4 provider evidence is intentionally isolated from the lower-level suite and operator-triggered to control cost.
- path: .github/workflows/assurance-campaign-copilot.yml
  role: external
  cost_class: heavy
  draft_behavior: manual
  rationale: Provider-backed assurance campaigns may execute multiple judgement suites in one operator-triggered run and are isolated from ordinary PR gates.


