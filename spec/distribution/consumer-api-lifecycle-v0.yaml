version: 1
kind: harness-consumer-api-lifecycle
id: HARNESS-CONSUMER-API-LIFECYCLE-V0
owner: distribution
design: docs/design/harness-consumer-api-lifecycle-v0.md
compatibility_registry: spec/architecture/repository-layout-v0.yaml
states:
- SUPPORTED
- DEPRECATED
- EOL
- REMOVED
transitions:
- from: SUPPORTED
  to: DEPRECATED
  requires: explicit-distribution-decision
- from: DEPRECATED
  to: EOL
  requires: explicit-distribution-decision
- from: EOL
  to: REMOVED
  requires: explicit-distribution-decision
state_obligations:
  SUPPORTED:
  - latest-source-accepts-api
  - materialize-pack
  - wrapper-tooling-support
  - required-compatibility-tests
  DEPRECATED:
  - latest-source-still-works
  - no-new-consumers
  - migrate-to-v1
  - support-compatibility-defects-until-eol
  EOL:
  - latest-source-support-and-materialization-no-longer-obligatory
  - immutable-historical-revisions-remain-artifacts
  REMOVED:
  - explicit-prior-eol-decision-required
  - v0-only-source-deletion-and-registry-simplification-permitted
apis:
  v0:
    state: DEPRECATED
    decision: docs/design/harness-consumer-api-v0-deprecation.md
  v1:
    state: SUPPORTED
    decision: docs/design/harness-consumer-api-lifecycle-v0.md
