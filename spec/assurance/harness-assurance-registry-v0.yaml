    source_type: inspection
    status: implemented
    verified_at_revision: null
    limitations:
      - The check derives repository identities from registered TL5 known-project fixtures and rejects their use in executable generic runtime AST.
      - Comments and docstrings are excluded because they do not alter runtime behavior.
      - This mechanically detects known-project identity coupling; it does not prove absence of every possible semantic project bias.

