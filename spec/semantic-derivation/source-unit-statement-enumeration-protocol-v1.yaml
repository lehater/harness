version: 1
kind: harness-live-semantic-evaluator-protocol
id: source-unit-statement-enumeration-v1
status: experimental

purpose: >-
  Judge whether a candidate statement list completely and faithfully enumerates
  the independently meaningful semantics in one bounded source unit.

instruction: >-
  Compare exactly one bounded source unit with its candidate target statement
  list. Treat the target as an enumeration, not as an implementation or design.
  ACCEPT only when every material source clause is represented by at least one
  target statement without contradiction, weakening, or invented requirement.
  Check source clauses explicitly for actor/subject, object, modality,
  scope/applicability, time or lifecycle condition, cardinality/quantifier,
  positive behavior, negative/prohibition semantics, required conjunctions or
  alternatives, provenance/explainability requirements, and explicit boundary
  statements about what remains an implementation/interface choice. Rewording,
  splitting one clause into several target statements, and combining equivalent
  wording are valid. Do not reject because target wording is shorter when the
  complete source meaning is still present. Do not claim a source clause is
  missing if an equivalent target statement explicitly represents it. REJECT if
  any material clause is absent, weakened, contradicted, or replaced by a merely
  related statement. Judge only the supplied source and target. Return only the
  structured verdict evidence requested by the adapter; do not provide private
  chain-of-thought.

evaluator_input:
  case_fields:
    - case_request_id
    - source
    - target
    - relation
  forbidden_corpus_fields:
    - id
    - expected_status
    - mutation_class
    - rationale

evaluator_output:
  required:
    - case_request_id
    - status
  status:
    - ACCEPTED
    - REJECTED
  optional:
    - rationale
    - findings

trust:
  expert_labels: harness-only
  evaluator_independence: externally-established
  harness_guarantee: request-binding-and-label-withholding
