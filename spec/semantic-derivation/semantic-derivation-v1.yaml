version: 1
kind: harness-semantic-derivation-meta-contract
id: semantic-derivation/v1
status: experimental

purpose: >-
  Define generated evidence for semantic preservation across one direct
  Engineering Graph production dependency without requiring a literal
  downstream artifact shape.

model:
  subject: >-
    One direct edge source Capability -> target ProductionContract.
    Production quality and derivation quality are distinct checks.
  contract:
    kind: harness-semantic-derivation-contract
    required:
      - source_capability
      - target_capability
      - obligations
    semantic_judgement:
      required: optional-default-false
      required_checks: optional
      allowed_reviewer_kinds: optional-default-[EVALUATOR,HUMAN]
    lifecycle_dependency:
      exhaustive: optional-default-false
    obligation_fields:
      id: required
      source_kind: required
      min_count: optional-default-1
      subject: optional
      allow_not_applicable: optional-default-false
      require_target_provenance: optional-default-false
  evidence:
    kind: harness-semantic-derivation-evidence
    required:
      - source_capability
      - target_capability
      - links
    link_fields:
      id: required-when-semantic-judgement-required
      sources: required-non-empty
      relation: [PRESERVES, TRANSFORMS, CONSTRAINS, REALIZES]
      targets: required-non-empty
    semantic_judgement:
      kind: harness-semantic-derivation-judgement
      assurance: request-bound
      reviewer_kind: [EVALUATOR, HUMAN]
      status: [ACCEPTED, REJECTED]
      reviewed_links: required
      checks: required
      findings: required
    dispositions:
      statuses: [NOT_APPLICABLE, QUESTION]
      rationale: required
  evaluation:
    kind: harness-semantic-derivation-evaluation
    statuses: [ACCEPTED, REJECTED]
    deterministic_findings:
      - MISSING_REQUIRED_INPUT
      - DERIVATION_EVIDENCE_REQUIRED
      - INVALID_DERIVATION_LINKS
      - INVALID_DERIVATION_LINK
      - INVALID_DERIVATION_RELATION
      - UNKNOWN_DERIVATION_SOURCE
      - UNKNOWN_DERIVATION_TARGET
      - DERIVATION_TARGET_PROVENANCE_MISSING
      - INVALID_DERIVATION_DISPOSITIONS
      - INVALID_DERIVATION_DISPOSITION
      - DUPLICATE_DERIVATION_DISPOSITION
      - DERIVATION_DISPOSITION_CONFLICT
      - NOT_APPLICABLE_NOT_ALLOWED
      - UNDISPOSITIONED_SOURCE
      - DERIVATION_QUESTION
      - DERIVATION_LINK_ID_REQUIRED
      - DUPLICATE_DERIVATION_LINK_ID
      - SEMANTIC_DERIVATION_JUDGEMENT_REQUIRED
      - SEMANTIC_DERIVATION_JUDGEMENT_INVALID
      - SEMANTIC_DERIVATION_JUDGEMENT_REVIEWER_INVALID
      - SEMANTIC_DERIVATION_JUDGEMENT_BINDING_MISMATCH
      - SEMANTIC_DERIVATION_JUDGEMENT_STATUS_INVALID
      - SEMANTIC_DERIVATION_JUDGEMENT_CHECKS_INVALID
      - SEMANTIC_DERIVATION_JUDGEMENT_CHECKS_MISSING
      - SEMANTIC_DERIVATION_JUDGEMENT_LINKS_INVALID
      - SEMANTIC_DERIVATION_JUDGEMENT_INCOMPLETE
      - SEMANTIC_DERIVATION_JUDGEMENT_UNKNOWN_LINKS
      - SEMANTIC_DERIVATION_JUDGEMENT_FINDINGS_INVALID
      - SEMANTIC_DERIVATION_JUDGEMENT_REJECTED
      - LIFECYCLE_DEPENDENCY_INCOMPLETE

rules:
  input_gap: >-
    If an input obligation is absent, route the Question to the Authority that
    owns the source Capability and block that source Capability. Downstream work
    then waits through the existing Engineering Graph dependency.
  derivation_gap: >-
    If a required accepted source assertion exists but has neither a valid
    derivation link nor an explicit disposition, reject the downstream
    derivation. This is a downstream producer defect, not an upstream Question.
  alternatives: >-
    Several downstream designs may be valid. Acceptance depends on required
    semantic coverage and valid evidence, not literal target identities or shape.
  explicit_target_provenance: >-
    An obligation may set require_target_provenance when a source atom must be
    materially represented by the downstream semantic contract rather than merely
    named in external derivation evidence. Such a source is covered only when at
    least one linked target assertion explicitly lists that source id in derived_from.
    This is a deterministic provenance/realization guard; it does not by itself
    prove arbitrary natural-language entailment.
  semantic_truth: >-
    A derivation contract may require semantic judgement when deterministic
    trace structure cannot establish meaning preservation. Harness generates a
    deterministic judgement request bound to the exact required source
    assertions, referenced target assertions, derivation links and required
    checks. ACCEPTED judgement applies only to that request. A stale or changed
    candidate therefore cannot reuse an old verdict.
  judgement_trust: >-
    REQUEST_BOUND proves evidence binding, not reviewer independence or model
    correctness. Stronger trusted-execution assurance requires separate external
    attestation and is outside this v1 mechanism.
  irrelevant_input: >-
    Source assertions outside declared input obligations do not affect
    derivation acceptance unless lifecycle_dependency.exhaustive is true.
  selective_lifecycle: >-
    A derivation evaluation may become an authoritative selective lifecycle
    baseline only when lifecycle_dependency.exhaustive is true and every source
    semantic assertion is either covered by a derivation link or explicitly
    dispositioned. This prevents a partial derivation contract from classifying
    unknown upstream changes as irrelevant.
  core: >-
    Semantic derivation evidence is generated evidence above Core. It does not
    introduce a new Core entity.

non_goals:
  - universal ontology of engineering semantics
  - literal artifact golden snapshots
  - proof of arbitrary natural-language entailment
  - replacement for Decision Governance
  - automatic proof that every declared transformation is semantically truthful
