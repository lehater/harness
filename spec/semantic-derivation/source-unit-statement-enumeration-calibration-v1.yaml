    expected_status: REJECTED
    mutation_class: source-unit-enumeration-omission
    source: >-
      For one semantic identity tuple, exactly one authoritative Access Rule
      exists. Repeated materialization of the same Allowed identity is idempotent
      and resolves the existing Rule ID. On first materialization from Allowed,
      the Rule starts in Active state. Acceptance intent also states that a
      NotAllowed proposal creates no Rule.
    target:
      - One authoritative Access Rule exists for one semantic identity tuple.
      - Repeated Allowed materialization is idempotent and resolves the existing Rule ID.
      - A NotAllowed proposal creates no authoritative Rule.
    relation: TRANSFORMS
    rationale: The initial Active-state requirement is omitted.

  - id: w1-008-enumeration-omission
    expected_status: REJECTED
    mutation_class: source-unit-enumeration-omission
    source: >-
      An actor with required read/export authority may select a domain-policy
