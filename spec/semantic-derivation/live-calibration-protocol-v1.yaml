version: 1
kind: harness-live-semantic-evaluator-protocol
id: semantic-derivation-live-calibration-v1
status: experimental

purpose: >-
  Ask an external semantic evaluator to classify one blinded source-to-target
  semantic transformation without exposing expert calibration labels.

instruction: >-
  Judge whether the target preserves or validly realizes the source semantics
  under the declared relation. Return ACCEPTED when the required meaning is
  preserved without contradiction or material loss; otherwise return REJECTED.
  Return only the structured verdict evidence requested by the adapter. Do not
  provide or require private chain-of-thought.

evaluator_input:
  case_fields:
    - case_request_id
    - source
    - target
    - relation
  forbidden_corpus_fields:
    - id
    - expected_status
    - mutation_class
    - rationale

evaluator_output:
  required:
    - case_request_id
    - status
  status:
    - ACCEPTED
    - REJECTED
  optional:
    - rationale
    - findings

trust:
  expert_labels: harness-only
  evaluator_independence: externally-established
  harness_guarantee: request-binding-and-label-withholding
