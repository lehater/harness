version: 1
kind: harness-cdr-real-project-pilot
project_repository: lehater/prep
# Immutable checkout; never resolve a moving ref inside evidence generation.
project_commit: c52ff8ec1a4732285b2b299bf11dca9869fb2fee
status: read-only
selection_policy: >-
  The target Capability selection and accepted source-context heading
  selectors are operator-specified. Provider catalogs and public claims are
  derived from the pinned project's Core, semantic baseline and registered
  artifact contents; neither target requires nor an oracle may be supplied.
targets:
  - capability: prep.preparation-information-model
    repository: lehater/prep
    scope_source: docs/architecture/model-context-map.md
    scope_headings:
      - MC-01 Preparation Information
    strategic_scope_source: docs/architecture/context-map.md
    strategic_scope_headings:
      - DS-01 Preparation Information — CORE
    product_requirements_source: .harness/knowledge/product-capabilities.yaml
    # Experimental control arm only: operator paraphrases, NOT accepted domain requirements.
    neutral_output_obligations:
      - id: current-information-meaning
        description: >-
          Define the tactical semantic concepts, distinctions and invariants
          of current preparation information, including goals, capabilities,
          knowledge and practice material, without inferring learner state.
      - id: current-information-relationships
        description: >-
          Define meaningful relationships between preparation-information
          kinds while allowing different ways to understand the same
          information without committing to a taxonomy or graph topology.
  - capability: prep.recorded-activity-history-model
    repository: lehater/prep
    scope_source: docs/architecture/model-context-map.md
    scope_headings:
      - MC-02 Recorded Activity History
      - TR-01 Preparation Information and Recorded Activity History
    strategic_scope_source: docs/architecture/context-map.md
    strategic_scope_headings:
      - DS-02 Recorded Activity History — CORE
    product_requirements_source: .harness/knowledge/product-capabilities.yaml
    # Experimental control arm only: operator paraphrases, NOT accepted domain requirements.
    neutral_output_obligations:
      - id: historical-record-meaning
        description: >-
          Define the tactical concepts and invariants for retained activity
          and optional result facts, including when they occurred and the
          information they concerned, without making learner-state conclusions.
      - id: historical-reference-survival
        description: >-
          Define semantic relationships to current preparation information
          and preserve intelligibility of historical records when related
          current information is changed or removed, without redefining
          the current information.
