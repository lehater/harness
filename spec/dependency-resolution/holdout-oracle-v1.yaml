version: 1
kind: harness-dependency-resolution-calibration-oracle
status: experimental-holdout
privacy: NEVER_SEND_TO_EVALUATED_AGENT
note: >-
  Provisional author-designed holdout labels; no evaluator has seen these cases
  at the time of corpus creation. Not independent expert-reviewed truth.
cases:
  - id: HLD-01
    review_status: AUTHOR_DRAFT
    expected_status: UNRESOLVED
    baseline_requires: []
    expected_requires: [holdout.partner-field-contract]
    expected_direct_needs:
      - {obligation: encode-partner-message, provider: holdout.partner-field-contract}
    expected_reconciliation:
      ADD: [holdout.partner-field-contract]
      KEEP: []
      REMOVE_CANDIDATE: []
    expected_unresolved_obligations: [enforce-release-consent]
    unresolved_reason: >-
      Sharing intent does not establish a consent enforcement rule and no consent
      policy producer is listed. The input does not explicitly hint at the gap.

  - id: HLD-02
    review_status: AUTHOR_DRAFT
    expected_status: UNRESOLVED
    baseline_requires: []
    expected_requires: [holdout.tax-rule-design, holdout.invoice-language]
    expected_direct_needs:
      - {obligation: quote-regional-tax, provider: holdout.tax-rule-design}
      - {obligation: represent-invoice-amount, provider: holdout.invoice-language}
    expected_reconciliation:
      ADD: [holdout.tax-rule-design, holdout.invoice-language]
      KEEP: []
      REMOVE_CANDIDATE: []
    expected_unresolved_obligations: [quote-regional-tax]
    unresolved_reason: >-
      A contract-only tax provider justifies planned topology but no accepted
      rates/exemptions/effective-date semantics exist. Do not assert resolved
      acceptance of an executable regional tax calculation.

