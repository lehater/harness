version: 1
kind: harness-scenario
id: external-project-derivation-test-coverage
title: Prep and NAPMS Engineering Graph snapshots have reusable derivation test coverage
dimensions:
  project_archetype: real-project
  stage: diagnosis
  behavior_class: coverage
  execution_type: real-project
covers:
  - derivation-test-coverage

fixtures:
  prep-graph:
    yaml: ../fixtures/external/prep-engineering-graph.yaml
  napms-graph:
    yaml: ../fixtures/external/napms-engineering-graph.yaml
  scenario-directory:
    path: .

steps:
  - id: prep-coverage
    driver: semantic.derivation_test_coverage
    with:
      graph: {ref: fixture.prep-graph}
      scenario_directory: {ref: fixture.scenario-directory}
      dispositions: []
    expect:
      - {path: /status, op: equals, value: COMPLETE}
      - {path: /gap_count, op: equals, value: 0}
      - {path: /invalid_registration_count, op: equals, value: 0}
    observe:
      edge_count: /edge_count
      covered_count: /covered_count

  - id: napms-coverage
    driver: semantic.derivation_test_coverage
    with:
      graph: {ref: fixture.napms-graph}
      scenario_directory: {ref: fixture.scenario-directory}
      dispositions: []
    expect:
      - {path: /status, op: equals, value: COMPLETE}
      - {path: /gap_count, op: equals, value: 0}
      - {path: /invalid_registration_count, op: equals, value: 0}
    observe:
      edge_count: /edge_count
      covered_count: /covered_count
