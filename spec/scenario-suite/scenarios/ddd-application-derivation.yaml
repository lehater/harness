version: 1
kind: harness-scenario
id: ddd-application-semantic-derivation
title: DDD and Application design preserve strategic, contextual and tactical semantics
dimensions:
  project_archetype: real-project
  stage: design
  behavior_class: semantic
  execution_type: deterministic
covers:
  - semantic-derivation-coverage

derivation_edges:
  - {source_knowledge_kind: product-requirements, target_knowledge_kind: product-requirements}
  - {source_knowledge_kind: product-requirements, target_knowledge_kind: domain-strategy}
  - {source_knowledge_kind: product-requirements, target_knowledge_kind: model-context-strategy}
  - {source_knowledge_kind: domain-strategy, target_knowledge_kind: model-context-strategy}
  - {source_knowledge_kind: problem-evidence, target_knowledge_kind: domain-use-case}
  - {source_knowledge_kind: strategic-domain-design, target_knowledge_kind: domain-use-case}
  - {source_knowledge_kind: model-context-strategy, target_knowledge_kind: domain-model}
  - {source_knowledge_kind: product-requirements, target_knowledge_kind: domain-model}
  - {source_knowledge_kind: domain-use-case, target_knowledge_kind: domain-model}
  - {source_knowledge_kind: strategic-domain-design, target_knowledge_kind: domain-model}
  - {source_knowledge_kind: domain-model, target_knowledge_kind: domain-model}
  - {source_knowledge_kind: product-requirements, target_knowledge_kind: application-design}
  - {source_knowledge_kind: domain-model, target_knowledge_kind: application-design}
  - {source_knowledge_kind: strategic-domain-design, target_knowledge_kind: application-design}
  - {source_knowledge_kind: application-design, target_knowledge_kind: task-model}
  - {source_knowledge_kind: domain-model, target_knowledge_kind: task-model}
  - {source_knowledge_kind: application-design, target_knowledge_kind: user-journey-design}
  - {source_knowledge_kind: domain-model, target_knowledge_kind: user-journey-design}
  - {source_knowledge_kind: application-design, target_knowledge_kind: conceptual-interface-model}
  - {source_knowledge_kind: domain-model, target_knowledge_kind: conceptual-interface-model}
  - {source_knowledge_kind: application-design, target_knowledge_kind: interaction-design}
  - {source_knowledge_kind: application-design, target_knowledge_kind: interface-contract}
  - {source_knowledge_kind: domain-model, target_knowledge_kind: interface-contract}
  - {source_knowledge_kind: domain-model, target_knowledge_kind: quality-design}

fixtures:
  graph:
    value:
      version: 1
      kind: harness-engineering-graph
      id: DDD-APPLICATION-DERIVATION
      authorities:
        - id: DISCOVERY
          responsibility: Own accepted problem evidence.
          boundary: {semantic_cohesion: "Own accepted problem evidence.", independent_change: "Owned semantics can evolve behind accepted prerequisites.", public_contract: "Provides accepted DISCOVERY knowledge."}
          produces:
            - capability: demo.problem
              knowledge_kind: problem-evidence
              requires: []
        - id: PRODUCT-REQUIREMENTS
          responsibility: Own accepted product intent and behavior.
          boundary: {semantic_cohesion: "Own accepted product intent and behavior.", independent_change: "Owned semantics can evolve behind accepted prerequisites.", public_contract: "Provides accepted PRODUCT-REQUIREMENTS knowledge."}
          produces:
            - capability: demo.intent
              knowledge_kind: product-requirements
              requires: []
            - capability: demo.capabilities
              knowledge_kind: product-requirements
              requires:
                - capability: demo.intent
        - id: DOMAIN-STRATEGY
          responsibility: Own strategic problem-space responsibility classification.
          boundary: {semantic_cohesion: "Own strategic problem-space responsibility classification.", independent_change: "Owned semantics can evolve behind accepted prerequisites.", public_contract: "Provides accepted DOMAIN-STRATEGY knowledge."}
          produces:
            - capability: demo.domain-strategy
              knowledge_kind: domain-strategy
              requires:
                - capability: demo.capabilities
        - id: STRATEGIC-DOMAIN-DESIGN
          responsibility: Own strategic domain boundaries.
          boundary: {semantic_cohesion: "Own strategic domain boundaries.", independent_change: "Owned semantics can evolve behind accepted prerequisites.", public_contract: "Provides accepted STRATEGIC-DOMAIN-DESIGN knowledge."}
          produces:
            - capability: demo.strategic
              knowledge_kind: strategic-domain-design
              requires: []
        - id: MODEL-CONTEXT-STRATEGY
          responsibility: Own model-language applicability and context relationships.
          boundary: {semantic_cohesion: "Own model-language applicability and context relationships.", independent_change: "Owned semantics can evolve behind accepted prerequisites.", public_contract: "Provides accepted MODEL-CONTEXT-STRATEGY knowledge."}
          produces:
            - capability: demo.model-context
              knowledge_kind: model-context-strategy
              requires:
                - capability: demo.capabilities
                - capability: demo.domain-strategy
        - id: DOMAIN-USE-CASE-DESIGN
          responsibility: Own domain use-case behavior.
          boundary: {semantic_cohesion: "Own domain use-case behavior.", independent_change: "Owned semantics can evolve behind accepted prerequisites.", public_contract: "Provides accepted DOMAIN-USE-CASE-DESIGN knowledge."}
          produces:
            - capability: demo.use-case
              knowledge_kind: domain-use-case
              requires:
                - capability: demo.problem
                - capability: demo.strategic
        - id: TACTICAL-DOMAIN-DESIGN
          responsibility: Own tactical domain semantics and invariants.
          boundary: {semantic_cohesion: "Own tactical domain semantics and invariants.", independent_change: "Owned semantics can evolve behind accepted prerequisites.", public_contract: "Provides accepted TACTICAL-DOMAIN-DESIGN knowledge."}
          produces:
            - capability: demo.domain-foundation
              knowledge_kind: domain-model
              requires:
                - capability: demo.model-context
                - capability: demo.capabilities
                - capability: demo.use-case
                - capability: demo.strategic
            - capability: demo.domain-model
              knowledge_kind: domain-model
              requires:
                - capability: demo.domain-foundation
        - id: APPLICATION-DESIGN
          responsibility: Own application orchestration and intended human work.
          boundary: {semantic_cohesion: "Own application orchestration and intended human work.", independent_change: "Owned semantics can evolve behind accepted prerequisites.", public_contract: "Provides accepted APPLICATION-DESIGN knowledge."}
          produces:
            - capability: demo.application
              knowledge_kind: application-design
              requires:
                - capability: demo.capabilities
                - capability: demo.domain-model
                - capability: demo.strategic
            - capability: demo.task
              knowledge_kind: task-model
              requires:
                - capability: demo.application
                - capability: demo.domain-model
            - capability: demo.journey
              knowledge_kind: user-journey-design
              requires:
                - capability: demo.application
                - capability: demo.domain-model
        - id: HUMAN-INTERFACE-DESIGN
          responsibility: Own human-interface semantics.
          boundary: {semantic_cohesion: "Own human-interface semantics.", independent_change: "Owned semantics can evolve behind accepted prerequisites.", public_contract: "Provides accepted HUMAN-INTERFACE-DESIGN knowledge."}
          produces:
            - capability: demo.conceptual
              knowledge_kind: conceptual-interface-model
              requires:
                - capability: demo.application
                - capability: demo.domain-model
            - capability: demo.interaction
              knowledge_kind: interaction-design
              requires:
                - capability: demo.application
        - id: MACHINE-INTERFACE-DESIGN
          responsibility: Own machine interface semantics.
          boundary: {semantic_cohesion: "Own machine interface semantics.", independent_change: "Owned semantics can evolve behind accepted prerequisites.", public_contract: "Provides accepted MACHINE-INTERFACE-DESIGN knowledge."}
          produces:
            - capability: demo.interface
              knowledge_kind: interface-contract
              requires:
                - capability: demo.application
                - capability: demo.domain-model
        - id: QUALITY-DESIGN
          responsibility: Own architecture-significant quality constraints.
          boundary: {semantic_cohesion: "Own architecture-significant quality constraints.", independent_change: "Owned semantics can evolve behind accepted prerequisites.", public_contract: "Provides accepted QUALITY-DESIGN knowledge."}
          produces:
            - capability: demo.quality
              knowledge_kind: quality-design
              requires:
                - capability: demo.domain-model
      consumers:
        - id: DOWNSTREAM-DESIGN
          purpose: Consume accepted DDD/Application knowledge without inventing upstream semantics.
          requires:
            - capability: demo.task
            - capability: demo.journey
            - capability: demo.conceptual
            - capability: demo.interaction
            - capability: demo.interface
            - capability: demo.quality
      terminal_capabilities: []

  problem:
    value:
      semantic_assertions:
        - id: PROBLEM
          kind: problem-observation
          subject: RESOURCE-CHANGE
          semantic_value: "users-cannot-complete-resource-change-without-manual-reconciliation"
