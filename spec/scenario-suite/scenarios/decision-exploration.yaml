version: 1
kind: harness-scenario
id: decision-exploration-stays-pre-choice
title: Decision exploration rejects preselected solutions
dimensions:
  project_archetype: synthetic
  stage: decision
  behavior_class: decision
  execution_type: agent-evaluation
covers:
  - decision-exploration-blindness

fixtures:
  contract:
    value:
      knowledge_kind: demo-decision
      required: true
      policy_defaults:
        exploration: EXPLORE
        autonomy: CONSERVATIVE
      axes:
        shape:
          minimum_exploration: EXPLORE
          delegation_requires: BROAD
          material_dimensions: [failure-isolation]
          challenge_strategies: [alternative-shape, failure-probe]
          minimum_probes: 2
  axis_policies:
    value:
      shape:
        exploration: EXPLORE
        autonomy: BROAD
  request:
    value:
      request_id: REQUEST-1
  model:
    value:
      artifacts: []
      questions: []
  evidence:
    value:
      version: 1
      kind: harness-decision-exploration
      capability: demo.choice
      knowledge_kind: demo-decision
      explorer_request_id: REQUEST-1
      research_sources: []
      axes:
        - axis: shape
          applicability: APPLICABLE
          exploration_level: EXPLORE
          probes:
            - strategy: alternative-shape
              challenge: Compare a materially different runtime shape.
              alternatives: [shape-a, shape-b]
            - strategy: failure-probe
              challenge: Compare failure isolation under both alternatives.
              alternatives: [shape-a, shape-b]
          decision_points:
            - id: shape-choice
              alternatives:
                - id: shape-a
                  difference: Single runtime boundary.
                  material_effects:
                    failure-isolation: shared
                - id: shape-b
                  difference: Split runtime boundaries.
                  material_effects:
                    failure-isolation: isolated
      decision_space_review:
        status: COMPLETE
        checks:
          - mixed-decision-split
          - missing-material-case-search
          - impact-and-reversal-frontier-check
          - accepted-constraint-cross-check
          - authority-boundary-cross-check
        reviewed_decisions: [shape-choice]
        open_gaps: []

steps:
  - id: valid
    driver: decision.exploration
    with:
      contract: {ref: fixture.contract}
      axis_policies: {ref: fixture.axis_policies}
      capability: demo.choice
      knowledge_kind: demo-decision
      evidence: {ref: fixture.evidence}
      explorer_request: {ref: fixture.request}
      model: {ref: fixture.model}
    expect:
      - {path: /status, op: equals, value: ACCEPTED}
      - {path: /findings, op: length, value: 0}

  - id: contaminate
    driver: data.patch
    with:
      value: {ref: fixture.evidence}
      operations:
        - {op: add, path: /axes/0/selected, value: shape-a}

  - id: reject-preselection
    driver: decision.exploration
    with:
      contract: {ref: fixture.contract}
      axis_policies: {ref: fixture.axis_policies}
      capability: demo.choice
      knowledge_kind: demo-decision
      evidence: {ref: step.contaminate}
      explorer_request: {ref: fixture.request}
      model: {ref: fixture.model}
    expect:
      - {path: /status, op: equals, value: REJECTED}
      - {path: /findings, op: contains_match, value: {code: DECISION_EXPLORATION_NOT_BLIND}}
