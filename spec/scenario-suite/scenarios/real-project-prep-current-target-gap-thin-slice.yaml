    with: {graph: {ref: fixture.graph}, contract: {ref: fixture.task-to-conceptual}, source: {ref: fixture.activated-task-surface}, candidate: {ref: fixture.conceptual-surface}, evidence: {ref: fixture.missing-conceptual-evidence}}
    expect:
