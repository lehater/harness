  - id: task-to-interaction
    driver: semantic.derivation
    with: {graph: {ref: fixture.graph}, contract: {ref: fixture.task-to-interaction}, source: {ref: fixture.task-surface}, candidate: {ref: fixture.interaction-surface}, evidence: {ref: fixture.task-to-interaction-evidence}}
