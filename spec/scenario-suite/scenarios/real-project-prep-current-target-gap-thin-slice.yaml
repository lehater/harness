          responsibility: Own product intent and current product scope.
          boundary: {semantic_cohesion: Product outcomes and scope., independent_change: Product scope may change before downstream design., public_contract: Accepted product semantics.}
          produces:
            - {capability: prep.product-intent, knowledge_kind: product-requirements, requires: [prep.problem-evidence]}
            - {capability: prep.product-capabilities, knowledge_kind: product-requirements, requires: [prep.product-intent]}
