  - id: sensitivity-activated-product
    driver: semantic.derivation
    benchmark: {metrics: [mutation_detection, root_cause_localization], mutation_class: activate-PC09-without-application-design}
    with: {graph: {ref: fixture.graph}, contract: {ref: fixture.product-to-application}, source: {ref: fixture.activated-product-surface}, candidate: {ref: fixture.application-surface}, evidence: {ref: fixture.missing-application-evidence}}
    expect:
      - {path: /status, op: equals, value: REJECTED}
      - {path: /findings, op: contains_match, value: {code: UNDISPOSITIONED_SOURCE, source: PC09-ACTIVATED, owner_authority: APPLICATION-DESIGN}}
  - id: application-to-task
    driver: semantic.derivation
    with: {graph: {ref: fixture.graph}, contract: {ref: fixture.application-to-task}, source: {ref: fixture.application-surface}, candidate: {ref: fixture.task-surface}, evidence: {ref: fixture.application-to-task-evidence}}
