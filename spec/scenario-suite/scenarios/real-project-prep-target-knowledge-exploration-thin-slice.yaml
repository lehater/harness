steps:
  - id: acquisition-scope
    driver: source.set
    with: {contract: {ref: fixture.acquisition-contract}, inventory: {ref: fixture.source-inventory}}
    expect:
      - {path: /status, op: equals, value: ACCEPTED}
      - {path: /required_channel_count, op: equals, value: 1}
  - id: source-boundary
    driver: source.boundary
    with: {source: {ref: fixture.problem-source}, manifest: {ref: fixture.problem-boundary}}
    expect:
      - {path: /status, op: equals, value: ACCEPTED}
      - {path: /source/line_count, op: equals, value: 2}
      - {path: /covered_line_count, op: equals, value: 2}
  - id: statements
    driver: source.coverage
    with: {document: {ref: fixture.statement-ledger}}
    expect:
      - {path: /valid, op: equals, value: true}
      - {path: /classification_counts/ADMITTED, op: equals, value: 2}
  - id: accepted-problem-surface
    driver: semantic.acceptance
    with: {contract: {ref: fixture.problem-acceptance-contract}, sources: {ref: fixture.source-atoms}, candidate: {ref: fixture.accepted-problem}}
    expect:
      - {path: /status, op: equals, value: ACCEPTED}
      - {path: /findings, op: length, value: 0}

  - id: problem-to-intent
    driver: semantic.derivation
    with: {graph: {ref: fixture.graph}, contract: {ref: fixture.problem-to-intent}, source: {ref: fixture.accepted-problem}, candidate: {ref: fixture.intent-surface}, evidence: {ref: fixture.problem-to-intent-evidence}}
    expect: [{path: /status, op: equals, value: ACCEPTED}, {path: /coverage/covered, op: equals, value: 2}]
  - id: intent-to-product
    driver: semantic.derivation
    with: {graph: {ref: fixture.graph}, contract: {ref: fixture.intent-to-product}, source: {ref: fixture.intent-surface}, candidate: {ref: fixture.product-surface}, evidence: {ref: fixture.intent-to-product-evidence}}
    expect: [{path: /status, op: equals, value: ACCEPTED}, {path: /coverage/covered, op: equals, value: 2}]
  - id: product-to-application
    driver: semantic.derivation
    with: {graph: {ref: fixture.graph}, contract: {ref: fixture.product-to-application}, source: {ref: fixture.product-surface}, candidate: {ref: fixture.application-surface}, evidence: {ref: fixture.product-to-application-evidence}}
    expect: [{path: /status, op: equals, value: ACCEPTED}, {path: /coverage/covered, op: equals, value: 2}]
  - id: application-to-task
    driver: semantic.derivation
    with: {graph: {ref: fixture.graph}, contract: {ref: fixture.application-to-task}, source: {ref: fixture.application-surface}, candidate: {ref: fixture.task-surface}, evidence: {ref: fixture.application-to-task-evidence}}
    expect: [{path: /status, op: equals, value: ACCEPTED}, {path: /coverage/covered, op: equals, value: 2}]
  - id: task-to-journey
    driver: semantic.derivation
    with: {graph: {ref: fixture.graph}, contract: {ref: fixture.task-to-journey}, source: {ref: fixture.task-surface}, candidate: {ref: fixture.journey-surface}, evidence: {ref: fixture.task-to-journey-evidence}}
    expect: [{path: /status, op: equals, value: ACCEPTED}, {path: /coverage/covered, op: equals, value: 2}]

  - id: journey-to-ia
    driver: semantic.derivation
    with: {graph: {ref: fixture.graph}, contract: {ref: fixture.journey-to-ia}, source: {ref: fixture.journey-surface}, candidate: {ref: fixture.ia-surface}, evidence: {ref: fixture.journey-to-ia-evidence}}
    expect: [{path: /status, op: equals, value: ACCEPTED}, {path: /coverage/covered, op: equals, value: 1}]
  - id: journey-to-interaction
    driver: semantic.derivation
    with: {graph: {ref: fixture.graph}, contract: {ref: fixture.journey-to-interaction}, source: {ref: fixture.journey-surface}, candidate: {ref: fixture.interaction-surface}, evidence: {ref: fixture.journey-to-interaction-evidence}}
    expect: [{path: /status, op: equals, value: ACCEPTED}, {path: /coverage/covered, op: equals, value: 2}]
  - id: ia-to-topology
    driver: semantic.derivation
    with: {graph: {ref: fixture.graph}, contract: {ref: fixture.ia-to-topology}, source: {ref: fixture.ia-surface}, candidate: {ref: fixture.topology-surface}, evidence: {ref: fixture.ia-to-topology-evidence}}
    expect: [{path: /status, op: equals, value: ACCEPTED}]
  - id: topology-to-screen
    driver: semantic.derivation
    with: {graph: {ref: fixture.graph}, contract: {ref: fixture.topology-to-screen}, source: {ref: fixture.topology-surface}, candidate: {ref: fixture.screen-surface}, evidence: {ref: fixture.topology-to-screen-evidence}}
    expect: [{path: /status, op: equals, value: ACCEPTED}]
  - id: interaction-to-screen
    driver: semantic.derivation
    with: {graph: {ref: fixture.graph}, contract: {ref: fixture.interaction-to-screen}, source: {ref: fixture.interaction-surface}, candidate: {ref: fixture.screen-surface}, evidence: {ref: fixture.interaction-to-screen-evidence}}
    expect: [{path: /status, op: equals, value: ACCEPTED}]

  - id: sensitivity-screen-loses-target-scope
    driver: semantic.derivation
    benchmark: {metrics: [mutation_detection, root_cause_localization], mutation_class: remove-target-scope-from-screen}
    with: {graph: {ref: fixture.graph}, contract: {ref: fixture.topology-to-screen}, source: {ref: fixture.topology-surface}, candidate: {ref: fixture.mutated-screen-surface}, evidence: {ref: fixture.topology-to-mutated-screen-evidence}}
    expect:
      - {path: /status, op: equals, value: REJECTED}
      - {path: /findings, op: contains_match, value: {code: UNDISPOSITIONED_SOURCE, source: TOPOLOGY-TARGET-SCOPE, owner_authority: HUMAN-INTERFACE-DESIGN}}

  - id: screen-to-architecture
    driver: semantic.derivation
    with: {graph: {ref: fixture.graph}, contract: {ref: fixture.screen-to-architecture}, source: {ref: fixture.screen-surface}, candidate: {ref: fixture.architecture-surface}, evidence: {ref: fixture.screen-to-architecture-evidence}}
    expect: [{path: /status, op: equals, value: ACCEPTED}, {path: /coverage/covered, op: equals, value: 2}]
  - id: architecture-to-component
    driver: semantic.derivation
    with: {graph: {ref: fixture.graph}, contract: {ref: fixture.architecture-to-component}, source: {ref: fixture.architecture-surface}, candidate: {ref: fixture.component-surface}, evidence: {ref: fixture.architecture-to-component-evidence}}
    expect: [{path: /status, op: equals, value: ACCEPTED}, {path: /coverage/covered, op: equals, value: 2}]
  - id: sensitivity-component-loses-representation-independence
    driver: semantic.derivation
    benchmark: {metrics: [mutation_detection, root_cause_localization], mutation_class: remove-representation-independence-from-component-design}
    with: {graph: {ref: fixture.graph}, contract: {ref: fixture.architecture-to-component}, source: {ref: fixture.architecture-surface}, candidate: {ref: fixture.mutated-component-surface}, evidence: {ref: fixture.architecture-to-mutated-component-evidence}}
    expect:
      - {path: /status, op: equals, value: REJECTED}
      - {path: /findings, op: contains_match, value: {code: UNDISPOSITIONED_SOURCE, source: ARCH-REPRESENTATION, owner_authority: COMPONENT-DESIGN}}

  - id: product-to-verification
    driver: semantic.derivation
    with: {graph: {ref: fixture.graph}, contract: {ref: fixture.product-to-verification}, source: {ref: fixture.product-surface}, candidate: {ref: fixture.verification-surface}, evidence: {ref: fixture.product-to-verification-evidence}}
    expect: [{path: /status, op: equals, value: ACCEPTED}, {path: /coverage/covered, op: equals, value: 2}]
  - id: verification-to-test
    driver: semantic.derivation
    with: {graph: {ref: fixture.graph}, contract: {ref: fixture.verification-to-test}, source: {ref: fixture.verification-surface}, candidate: {ref: fixture.test-surface}, evidence: {ref: fixture.verification-to-test-evidence}}
    expect: [{path: /status, op: equals, value: ACCEPTED}, {path: /coverage/covered, op: equals, value: 2}]

  - id: component-to-implementation
    driver: semantic.derivation
    with: {graph: {ref: fixture.graph}, contract: {ref: fixture.component-to-implementation}, source: {ref: fixture.component-surface}, candidate: {ref: fixture.implementation-surface}, evidence: {ref: fixture.component-to-implementation-evidence}}
    expect: [{path: /status, op: equals, value: ACCEPTED}, {path: /coverage/covered, op: equals, value: 2}]
  - id: test-to-implementation
    driver: semantic.derivation
    with: {graph: {ref: fixture.graph}, contract: {ref: fixture.test-to-implementation}, source: {ref: fixture.test-surface}, candidate: {ref: fixture.implementation-surface}, evidence: {ref: fixture.test-to-implementation-evidence}}
    expect: [{path: /status, op: equals, value: ACCEPTED}, {path: /coverage/covered, op: equals, value: 2}]
