    with: {graph: {ref: fixture.graph}, contract: {version: 1, kind: harness-semantic-derivation-contract, source_capability: demo.presentation, target_capability: demo.screen, obligations: [{id: semantics, source_kind: presentation-pattern, min_count: 2}]}, source: {ref: fixture.presentation}, candidate: {ref: fixture.screen}, evidence: {version: 1, kind: harness-semantic-derivation-evidence, source_capability: demo.presentation, target_capability: demo.screen, links: [{sources: [PRESENT-RESOURCE, PRESENT-EDIT], relation: REALIZES, targets: [SCREEN-RESOURCE, SCREEN-EDIT]}], dispositions: []}}
    expect: [{path: /status, op: equals, value: ACCEPTED}]
  - id: api-screen
    driver: semantic.derivation
    with: {graph: {ref: fixture.graph}, contract: {version: 1, kind: harness-semantic-derivation-contract, source_capability: demo.api, target_capability: demo.screen, obligations: [{id: semantics, source_kind: interface-error}]}, source: {ref: fixture.api}, candidate: {ref: fixture.screen}, evidence: {version: 1, kind: harness-semantic-derivation-evidence, source_capability: demo.api, target_capability: demo.screen, links: [{sources: [API-ERROR], relation: REALIZES, targets: [SCREEN-ERROR]}], dispositions: []}}
    expect: [{path: /status, op: equals, value: ACCEPTED}]

  - id: remove-quality-link
    driver: data.patch
    with: {value: {version: 1, kind: harness-semantic-derivation-evidence, source_capability: demo.quality, target_capability: demo.presentation, links: [{sources: [QUALITY-REFLOW], relation: REALIZES, targets: [PRESENT-REFLOW]}], dispositions: []}, operations: [{op: remove, path: /links/0}]}
  - id: presentation-loses-quality
    driver: semantic.derivation
    with: {graph: {ref: fixture.graph}, contract: {version: 1, kind: harness-semantic-derivation-contract, source_capability: demo.quality, target_capability: demo.presentation, obligations: [{id: semantics, source_kind: quality-constraint}]}, source: {ref: fixture.quality}, candidate: {ref: fixture.presentation}, evidence: {ref: step.remove-quality-link}}
    expect:
      - {path: /status, op: equals, value: REJECTED}
      - {path: /findings, op: contains_match, value: {code: UNDISPOSITIONED_SOURCE, source: QUALITY-REFLOW, owner_authority: HUMAN}}
