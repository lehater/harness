version: 1
kind: harness-scenario
id: human-interface-semantic-derivation
title: Human-interface design preserves product, domain, task, journey, security and machine semantics
dimensions:
  project_archetype: user-facing
  stage: design
  behavior_class: semantic
  execution_type: deterministic
covers:
  - semantic-derivation-coverage

derivation_edges:
  - {source_knowledge_kind: product-requirements, target_knowledge_kind: conceptual-interface-model}
  - {source_knowledge_kind: domain-use-case, target_knowledge_kind: conceptual-interface-model}
  - {source_knowledge_kind: task-model, target_knowledge_kind: conceptual-interface-model}
  - {source_knowledge_kind: user-journey-design, target_knowledge_kind: conceptual-interface-model}
  - {source_knowledge_kind: security-architecture, target_knowledge_kind: conceptual-interface-model}
  - {source_knowledge_kind: interface-contract, target_knowledge_kind: conceptual-interface-model}
  - {source_knowledge_kind: conceptual-interface-model, target_knowledge_kind: information-architecture-design}
  - {source_knowledge_kind: task-model, target_knowledge_kind: information-architecture-design}
  - {source_knowledge_kind: user-journey-design, target_knowledge_kind: information-architecture-design}
  - {source_knowledge_kind: conceptual-interface-model, target_knowledge_kind: interaction-design}
  - {source_knowledge_kind: user-journey-design, target_knowledge_kind: interaction-design}
  - {source_knowledge_kind: interface-contract, target_knowledge_kind: interaction-design}
  - {source_knowledge_kind: security-architecture, target_knowledge_kind: interaction-design}
  - {source_knowledge_kind: information-architecture-design, target_knowledge_kind: interface-topology-design}
  - {source_knowledge_kind: conceptual-interface-model, target_knowledge_kind: presentation-system-design}
  - {source_knowledge_kind: information-architecture-design, target_knowledge_kind: presentation-system-design}
  - {source_knowledge_kind: interaction-design, target_knowledge_kind: presentation-system-design}
  - {source_knowledge_kind: interface-topology-design, target_knowledge_kind: presentation-system-design}
  - {source_knowledge_kind: quality-design, target_knowledge_kind: presentation-system-design}
  - {source_knowledge_kind: presentation-system-design, target_knowledge_kind: screen-view-design}
  - {source_knowledge_kind: interface-contract, target_knowledge_kind: screen-view-design}

fixtures:
  graph:
    value:
      version: 1
      kind: harness-engineering-graph
      id: HUMAN-INTERFACE-DERIVATION
      authorities:
        - id: PRODUCT
          responsibility: Own requirements.
          boundary: {semantic_cohesion: Product intent., independent_change: Product changes., public_contract: Requirements.}
          produces: [{capability: demo.req, knowledge_kind: product-requirements, requires: []}]
        - id: DOMAIN
          responsibility: Own domain behavior.
          boundary: {semantic_cohesion: Domain behavior., independent_change: Domain changes., public_contract: Domain use cases.}
          produces: [{capability: demo.domain, knowledge_kind: domain-use-case, requires: []}]
        - id: APP
          responsibility: Own tasks and journeys.
          boundary: {semantic_cohesion: Human work., independent_change: Work changes., public_contract: Task and journey semantics.}
          produces:
            - {capability: demo.task, knowledge_kind: task-model, requires: []}
            - {capability: demo.journey, knowledge_kind: user-journey-design, requires: []}
        - id: SECURITY
          responsibility: Own security architecture.
          boundary: {semantic_cohesion: Trust and admission., independent_change: Security changes., public_contract: Security constraints.}
          produces: [{capability: demo.security, knowledge_kind: security-architecture, requires: []}]
        - id: MACHINE
          responsibility: Own machine interface.
          boundary: {semantic_cohesion: Machine contract., independent_change: Interface changes., public_contract: Interface contract.}
          produces: [{capability: demo.api, knowledge_kind: interface-contract, requires: []}]
        - id: QUALITY
          responsibility: Own quality constraints.
          boundary: {semantic_cohesion: Quality., independent_change: Quality changes., public_contract: Quality constraints.}
          produces: [{capability: demo.quality, knowledge_kind: quality-design, requires: []}]
        - id: HUMAN
          responsibility: Own human-interface semantics.
          boundary: {semantic_cohesion: Human interface., independent_change: Interface changes behind upstream meaning., public_contract: Human-interface design.}
          produces:
            - {capability: demo.conceptual, knowledge_kind: conceptual-interface-model, requires: [demo.req, demo.domain, demo.task, demo.journey, demo.security, demo.api]}
            - {capability: demo.ia, knowledge_kind: information-architecture-design, requires: [demo.conceptual, demo.task, demo.journey]}
            - {capability: demo.interaction, knowledge_kind: interaction-design, requires: [demo.conceptual, demo.task, demo.journey, demo.api, demo.security]}
            - {capability: demo.topology, knowledge_kind: interface-topology-design, requires: [demo.ia, demo.interaction]}
            - {capability: demo.presentation, knowledge_kind: presentation-system-design, requires: [demo.conceptual, demo.ia, demo.interaction, demo.topology, demo.quality]}
            - {capability: demo.screen, knowledge_kind: screen-view-design, requires: [demo.topology, demo.interaction, demo.presentation, demo.api]}
      consumers: [{id: FRONTEND, purpose: Consume screen design., requires: [demo.screen]}]
      terminal_capabilities: []

  req:
