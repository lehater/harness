version: 1
kind: harness-core-acceptance
id: CORE-V0-CROSS-AUTHORITY-CHANGE

model:
  authorities:
    - id: POLICY
    - id: ARCHITECTURE
    - id: IMPLEMENTATION
    - id: VERIFICATION

  artifacts:
    - id: POLICY-DOMAIN
      authority: POLICY
      path: docs/policy-domain.yaml
      provides: [policy.withdrawal-semantics]
      depends_on: []

    - id: POLICY-API
      authority: ARCHITECTURE
      path: docs/policy-api.yaml
      provides: [policy.withdrawal-http-contract]
      depends_on: [POLICY-DOMAIN]

    - id: POLICY-PERSISTENCE
      authority: ARCHITECTURE
      path: docs/policy-persistence.yaml
      provides: [policy.withdrawal-persistence]
      depends_on: [POLICY-DOMAIN]

    - id: POLICY-IMPLEMENTATION
      authority: IMPLEMENTATION
      path: src/policy.py
      provides: [policy.withdrawal-implementation]
      depends_on: [POLICY-DOMAIN, POLICY-API, POLICY-PERSISTENCE]

    - id: POLICY-VERIFICATION
      authority: VERIFICATION
      path: tests/test_policy_withdrawal.py
      provides: [policy.withdrawal-verification]
      depends_on: [POLICY-IMPLEMENTATION]

  questions:
    - id: Q-POLICY-WITHDRAWAL
      authority: POLICY
      text: Must withdrawal preserve the accepted policy history?
      answer_from: [POLICY-DOMAIN]
      blocks: [POLICY-IMPLEMENTATION]

    - id: Q-POLICY-RETENTION
      authority: POLICY
      text: What retention period does the stakeholder require?
      blocks: [POLICY-API]

expect:
  affected:
    artifact: POLICY-DOMAIN
    contains: [POLICY-API, POLICY-PERSISTENCE, POLICY-IMPLEMENTATION, POLICY-VERIFICATION]

  capability:
    id: policy.withdrawal-semantics
    providers: [POLICY-DOMAIN]
    owner: POLICY

  questions:
    unresolved: [Q-POLICY-RETENTION, Q-POLICY-WITHDRAWAL]

  next_action:
    capability: policy.withdrawal-implementation
    action: WAIT
    authority: IMPLEMENTATION
    providers: [POLICY-IMPLEMENTATION]
    questions: [Q-POLICY-RETENTION, Q-POLICY-WITHDRAWAL]

  completeness:
    expectations:
      - subject: POLICY-WITHDRAWAL
        capability: policy.withdrawal-semantics
      - subject: POLICY-WITHDRAWAL
        capability: policy.withdrawal-implementation
      - subject: POLICY-WITHDRAWAL
        capability: policy.withdrawal-verification
    coverage:
      - subject: POLICY-WITHDRAWAL
        capability: policy.withdrawal-semantics
    complete_coverage:
      - subject: POLICY-WITHDRAWAL
        capability: policy.withdrawal-semantics
      - subject: POLICY-WITHDRAWAL
        capability: policy.withdrawal-implementation
      - subject: POLICY-WITHDRAWAL
        capability: policy.withdrawal-verification
    missing:
      - subject: POLICY-WITHDRAWAL
        capability: policy.withdrawal-implementation
      - subject: POLICY-WITHDRAWAL
        capability: policy.withdrawal-verification
    frontier:
      status: BLOCKED
      design: []
      wait:
        - action: WAIT
          capability: policy.withdrawal-implementation
          authority: IMPLEMENTATION
          providers: [POLICY-IMPLEMENTATION]
          questions: [Q-POLICY-RETENTION, Q-POLICY-WITHDRAWAL]
          expectation:
            subject: POLICY-WITHDRAWAL
            capability: policy.withdrawal-implementation
        - action: WAIT
          capability: policy.withdrawal-verification
          authority: VERIFICATION
          providers: [POLICY-VERIFICATION]
          questions: [Q-POLICY-RETENTION, Q-POLICY-WITHDRAWAL]
          expectation:
            subject: POLICY-WITHDRAWAL
            capability: policy.withdrawal-verification
    question_frontier:
      - action: ASK
        question: Q-POLICY-RETENTION
        authority: POLICY
        text: What retention period does the stakeholder require?
      - action: RESOLVE
        question: Q-POLICY-WITHDRAWAL
        authority: POLICY
        text: Must withdrawal preserve the accepted policy history?
        answer_from: [POLICY-DOMAIN]
  blocked:
    artifact: POLICY-IMPLEMENTATION
    by: [Q-POLICY-WITHDRAWAL]

  resolution:
    question: Q-POLICY-WITHDRAWAL
    artifact: POLICY-DOMAIN
    unresolved_after: []
    blocked_after: []
    next_action:
      capability: policy.withdrawal-implementation
      action: DESIGN
      authority: IMPLEMENTATION
      providers: [POLICY-IMPLEMENTATION]
