name: Greenfield Engineering Graph

on:
  pull_request:
    paths:
      - "examples/greenfield-csv-deduplicator/**"
      - ".github/workflows/greenfield-engineering-graph.yml"
      - "engineering_graph.py"
  push:
    paths:
      - "examples/greenfield-csv-deduplicator/**"
      - ".github/workflows/greenfield-engineering-graph.yml"
      - "engineering_graph.py"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML
      - name: Validate graph
        run: python engineering_graph.py validate examples/greenfield-csv-deduplicator/engineering-graph.yaml
      - name: Evaluate implementation target
        run: |
          python engineering_graph.py evaluate             examples/greenfield-csv-deduplicator/engineering-graph.yaml             IMPLEMENTATION             examples/greenfield-csv-deduplicator/core-state.yaml

      - name: Verify semantic skill routing
        run: |
          python - <<'PY'
          import copy
          from pathlib import Path
          import yaml

          from agent_router import route_create_work

          graph = yaml.safe_load(
              Path("examples/greenfield-csv-deduplicator/engineering-graph.yaml").read_text()
          )
          model = yaml.safe_load(
              Path("examples/greenfield-csv-deduplicator/core-state.yaml").read_text()
          )
          registry = yaml.safe_load(
              Path("skills/artifact-skill-registry-v0.yaml").read_text()
          )

          missing = copy.deepcopy(model)
          for artifact in missing["artifacts"]:
              artifact["provides"] = [
                  capability
                  for capability in artifact.get("provides", [])
                  if capability != "csv-deduplicator.verification-strategy"
              ]

          routed = route_create_work(graph, "IMPLEMENTATION", missing, registry)
          assert routed["target_status"] == "READY", routed
          assert routed["unrouted"] == [], routed
          assert len(routed["routed"]) == 1, routed
          item = routed["routed"][0]
          assert item["capabilities"] == ["csv-deduplicator.verification-strategy"], item
          assert item["knowledge_kind"] == "verification-strategy", item
          assert item["skill"] == "skills/artifacts/verification-strategy/SKILL.md", item
          PY

      - name: Verify compatible CREATE capabilities group into one artifact work item
        run: |
          python - <<'PY'
          import copy
          from pathlib import Path
          import yaml

          from agent_router import route_create_work

          graph = yaml.safe_load(
              Path("examples/greenfield-csv-deduplicator/engineering-graph.yaml").read_text()
          )
          model = yaml.safe_load(
              Path("examples/greenfield-csv-deduplicator/core-state.yaml").read_text()
          )
          registry = yaml.safe_load(
              Path("skills/artifact-skill-registry-v0.yaml").read_text()
          )

          missing = copy.deepcopy(model)
          for artifact in missing["artifacts"]:
              artifact["provides"] = [
                  capability
                  for capability in artifact.get("provides", [])
                  if capability not in {
                      "csv-deduplicator.product-intent",
                      "csv-deduplicator.acceptance",
                  }
              ]

          routed = route_create_work(graph, "IMPLEMENTATION", missing, registry)
          assert routed["unrouted"] == [], routed
          product_work = [
              item
              for item in routed["routed"]
              if item.get("knowledge_kind") == "product-requirements"
          ]
          assert len(product_work) == 1, routed
          item = product_work[0]
          assert item["skill"] == "skills/artifacts/product-requirements/SKILL.md", item
          assert item["capabilities"] == [
              "csv-deduplicator.acceptance",
              "csv-deduplicator.product-intent",
          ], item
          PY

      - name: Verify empty greenfield root routes to Problem Evidence skill
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          from agent_router import route_create_work

          graph = yaml.safe_load(
              Path("examples/greenfield-csv-deduplicator/engineering-graph.yaml").read_text()
          )
          registry = yaml.safe_load(
              Path("skills/artifact-skill-registry-v0.yaml").read_text()
          )
          empty = {"artifacts": [], "questions": []}

          routed = route_create_work(
              graph,
              "IMPLEMENTATION",
              empty,
              registry,
          )
          assert routed["target_status"] == "READY", routed
          assert routed["unrouted"] == [], routed
          assert len(routed["routed"]) == 1, routed
          item = routed["routed"][0]
          assert item["knowledge_kind"] == "problem-evidence", item
          assert item["capabilities"] == ["csv-deduplicator.problem-evidence"], item
          assert item["skill"] == "skills/artifacts/problem-evidence/SKILL.md", item
          PY
