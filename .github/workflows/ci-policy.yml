name: CI policy

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "docs/design/ci-execution-policy-v0.md"
      - "spec/ci/**"
      - "checks/validate_ci_policy.py"
      - "checks/validate_assurance_registry.py"
      - "tests/test_behavioral_eval.py"
      - "tests/test_behavioral_eval_cases.py"
      - "adapters/copilot_behavioral_eval_agent.py"
      - "spec/behavioral-evals/**"
      - "evals/behavioral_eval.py"
      - "spec/behavioral-eval-integration/**"
      - "spec/assurance/harness-assurance-registry-v0.yaml"
      - "docs/design/harness-assurance-registry-v0.md"
      - "docs/design/harness-ability-to-evidence-v0.md"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "docs/design/ci-execution-policy-v0.md"
      - "spec/ci/**"
      - "checks/validate_ci_policy.py"
      - "checks/validate_assurance_registry.py"
      - "tests/test_behavioral_eval.py"
      - "tests/test_behavioral_eval_cases.py"
      - "adapters/copilot_behavioral_eval_agent.py"
      - "spec/behavioral-evals/**"
      - "evals/behavioral_eval.py"
      - "spec/behavioral-eval-integration/**"
      - "spec/assurance/harness-assurance-registry-v0.yaml"
      - "docs/design/harness-assurance-registry-v0.md"
      - "docs/design/harness-ability-to-evidence-v0.md"
      - "Makefile"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install PyYAML
      - run: python checks/validate_ci_policy.py
      - run: python checks/validate_assurance_registry.py
      - run: python tests/test_behavioral_eval.py
      - run: python tests/test_behavioral_eval_cases.py
