name: greenfield bootstrap assurance

on:
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Harness dependencies
        run: pip install PyYAML==6.0.3

      - name: Install pinned Copilot CLI
        run: |
          npm install -g @github/copilot@1.0.91
          copilot --version

      - name: Materialize provider-auto agent descriptor
        shell: bash
        run: |
          MODEL="auto"
          MODEL_SELECTION="provider-auto"
          sed \
            -e "s/__MODEL__/${MODEL}/g" \
            -e "s/__MODEL_SELECTION__/${MODEL_SELECTION}/g" \
            spec/behavioral-evals/copilot-agent.yaml.tmpl \
            > /tmp/behavioral-agent.yaml

      - name: Execute greenfield bootstrap cases
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HARNESS_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          mkdir -p behavioral-eval-evidence
          FAILED=0
          python - <<'PY' > /tmp/greenfield-templates.txt
          from pathlib import Path
          import yaml

          manifest_path = Path("spec/behavioral-evals/greenfield-bootstrap/manifest-v0.yaml")
          manifest = yaml.safe_load(manifest_path.read_text(encoding="utf-8"))
          for item in manifest["cases"]:
              print((manifest_path.parent / item["template"]).as_posix())
          PY
          while IFS= read -r TEMPLATE; do
            CASE="${TEMPLATE%.tmpl}"
            DESIGN="$(basename "$(dirname "${TEMPLATE}")")"
            sed "s/__HARNESS_REVISION__/${HARNESS_REVISION}/g" "${TEMPLATE}" > "${CASE}"
            python -m evals.greenfield_bootstrap_eval "${CASE}" \
              --agent-descriptor /tmp/behavioral-agent.yaml \
              --adapter-executable python \
              --adapter-arg "${GITHUB_WORKSPACE}/evals/adapters/copilot_greenfield_bootstrap_eval_agent.py" \
              --output-dir "behavioral-eval-evidence/${DESIGN}" \
              --json-summary "behavioral-eval-evidence/${DESIGN}-summary.json"
            STATUS=$?
            rm -f "${CASE}"
            if [[ ${STATUS} -ne 0 ]]; then
              FAILED=1
            fi
          done < /tmp/greenfield-templates.txt
          exit ${FAILED}

      - name: Persist greenfield evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greenfield-bootstrap-assurance
          path: behavioral-eval-evidence/
          if-no-files-found: error
          retention-days: 90
