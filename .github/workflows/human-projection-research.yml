name: Human Projection Research

on:
  push:
    branches: [experiment/human-projection-compiler-v1]
    paths:
      - "human_projection.py"
      - "validators/validate_human_projection.py"
      - "spec/human-projection-acceptance/**"
      - ".github/workflows/human-projection-research.yml"
  pull_request:
    paths:
      - "human_projection.py"
      - "validators/validate_human_projection.py"
      - "spec/human-projection-acceptance/**"
      - ".github/workflows/human-projection-research.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"
      - run: python -m pip install PyYAML
      - run: python validators/validate_human_projection.py
