name: TEMP dispatch affected assurance refresh

on:
  push:
    branches:
      - feature/data-model-dbml-projection

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch affected canonical campaigns
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for campaign in first-wave tl4-existing-project; do
            curl --fail-with-body -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/lehater/harness/actions/workflows/assurance-campaign-copilot.yml/dispatches \
              -d "{\"ref\":\"feature/data-model-dbml-projection\",\"inputs\":{\"campaign\":\"${campaign}\"}}"
          done
