name: CDR experimental focused validation

on:
  pull_request:
    paths:
      - "evals/cdr_reference_audit.py"
      - "evals/adapters/copilot_dependency_resolution_evaluator.py"
      - "tests/test_copilot_dependency_resolution_evaluator.py"
      - "evals/cdr_reference_provider_pilot.py"
      - "evals/cdr_direction_holdout.py"
      - "evals/cdr_prep_accepted_target_pilot.py"
      - "evals/cdr_provider_owned_surfaces.py"
      - "tests/test_cdr_provider_owned_surfaces.py"
      - "spec/dependency-resolution/project-pilots/prep-provider-owned-surface-selectors-v1.yaml"
      - "tests/test_cdr_prep_accepted_target_pilot.py"
      - "tests/test_cdr_direction_holdout.py"
      - "tests/test_cdr_reference_provider_pilot.py"
      - "spec/dependency-resolution/reference-provider-pilot-v1.yaml"
      - "evals/cdr_contract_change.py"
      - "tests/test_cdr_reference_audit.py"
      - "tests/test_cdr_contract_change.py"
      - "spec/research/reference-engineering-model-v0.yaml"
      - "spec/engineering-coverage/semantic-proof-contract-v1.yaml"
      - "catalogs/software-authorities-v0.yaml"
      - "spec/ci/check-registry-v0.yaml"
      - "spec/architecture/harness-context-map-v0.yaml"
      - ".github/workflows/cdr-experimental-focused.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install PyYAML==6.0.3
      - run: python checks/validate_context_boundaries.py
      - run: python tests/test_reference_engineering_model.py
      - run: python tests/test_cdr_reference_audit.py
      - run: python tests/test_cdr_reference_provider_pilot.py
      - run: python tests/test_cdr_direction_holdout.py
      - run: python tests/test_cdr_prep_accepted_target_pilot.py
      - run: python tests/test_cdr_provider_owned_surfaces.py
      - run: python tests/test_copilot_dependency_resolution_evaluator.py
      - run: python tests/test_cdr_contract_change.py

      - name: Prepare three-target provider pilot without existing edges
        run: |
          python -m evals.cdr_reference_provider_pilot prepare \
            --output cdr-evidence/reference-pilot-inputs.json \
            --request cdr-evidence/reference-pilot-blind-request.json
      - uses: actions/upload-artifact@v4
        with:
          name: cdr-reference-provider-phase-a
          path: |
            cdr-evidence/reference-pilot-inputs.json
            cdr-evidence/reference-pilot-blind-request.json
      - name: Prepare blinded reference corpus
        run: make cdr-reference-prepare CDR_OUTPUT=cdr-evidence/phase-a-source-only.json
      - uses: actions/upload-artifact@v4
        with:
          name: cdr-reference-phase-a-blind
          path: cdr-evidence/phase-a-source-only.json
      - name: Audit reference dependency declarations
        run: make cdr-reference-audit CDR_OUTPUT=cdr-evidence/phase-b-graph-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: cdr-reference-phase-b-review
          path: cdr-evidence/phase-b-graph-audit.json
