name: harness core

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "docs/design/**"
      - "adapters/**"
      - "spec/**"
      - "validators/**"
      - "harness.py"
      - "target_state.py"
      - "workspace.py"
      - "Makefile"
      - ".github/workflows/harness.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install PyYAML
      - run: make harness-check
