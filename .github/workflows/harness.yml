name: harness core

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install PyYAML==6.0.3
      - run: make harness-check
      - name: Evaluate greenfield implementation frontier
        run: |
          python -m harness.project_model.engineering_graph evaluate \
            examples/greenfield-csv-deduplicator/engineering-graph.yaml \
            IMPLEMENTATION \
            examples/greenfield-csv-deduplicator/core-state.yaml
