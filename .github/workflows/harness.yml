name: harness core

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "docs/design/**"
      - "profiles/**"
      - "skills/**"
      - "adapters/**"
      - "spec/**"
      - "validators/**"
      - "harness.py"
      - "target_state.py"
      - "workspace.py"
      - "Makefile"
      - "examples/greenfield-csv-deduplicator/**"
      - "experiments/**"
      - ".github/workflows/harness.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install PyYAML
      - run: make harness-check
      - name: Validate artifact schema experiments
        run: |
          python experiments/artifact_schemas/validate.py \
            experiments/artifact_schemas/greenfield-cli-contract.candidate.yaml
          if python experiments/artifact_schemas/validate.py \
            experiments/artifact_schemas/invalid-product-requirements.yaml; then
            echo "invalid research fixture was unexpectedly accepted" >&2
            exit 1
          fi
          echo "invalid research fixture rejected as expected"
          python experiments/artifact_schemas/validate_registries.py
      - name: Evaluate greenfield implementation frontier
        run: |
          python engineering_graph.py evaluate \
            examples/greenfield-csv-deduplicator/engineering-graph.yaml \
            IMPLEMENTATION \
            examples/greenfield-csv-deduplicator/core-state.yaml
