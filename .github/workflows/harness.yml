name: harness core

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "docs/design/**"
      - "profiles/**"
      - "skills/**"
      - "adapters/**"
      - "spec/**"
      - "validators/**"
      - "harness.py"
      - "engineering_graph.py"
      - "integration_alignment.py"
      - "authority_context.py"
      - "agent_router.py"
      - "target_state.py"
      - "workspace.py"
      - "Makefile"
      - "examples/greenfield-csv-deduplicator/**"
      - "examples/user-facing-application/**"
      - ".github/workflows/harness.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install PyYAML
      - run: make harness-check
      - name: Evaluate greenfield implementation frontier
        run: |
          python engineering_graph.py evaluate \
            examples/greenfield-csv-deduplicator/engineering-graph.yaml \
            IMPLEMENTATION \
            examples/greenfield-csv-deduplicator/core-state.yaml
