name: Re-audit integration validation

on:
  push:
    branches:
      - audit/harness-corrections-re-audit-integration

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install PyYAML
      - name: Remove temporary trigger from validation snapshot
        run: rm .github/workflows/re-audit-integration-validation.yml
      - name: Run deterministic Harness validation
        run: make harness-check
