# Repository tooling identity; this is not a published Harness release version.
[project]
name = "harness-core"
version = "0.0.0"
description = "Repository-independent Core for engineering-knowledge ownership."
requires-python = ">=3.10"
dependencies = [
    "PyYAML==6.0.3",
]

[tool.uv]
# Runtime implementations live under src/harness and execute through the explicit
# source-tree bridge. Installed-package execution is a separate policy decision.
package = false
