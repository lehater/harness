version: 1
kind: harness-engineering-graph
id: FRONTEND-UX-CLOSURE-EXPERIMENT
default_subject: FRONTEND-UX-CLOSURE

authorities:
  - id: APPLICATION-DESIGN
    responsibility: Own intended human work and goal-oriented journeys without deciding interface structure.
    boundary:
      semantic_cohesion: Intended task and journey composition.
      independent_change: Tasks and journeys can change before interface realization.
      public_contract: Provides task and journey knowledge to Human Interface Design.
    produces:
      - capability: experiment.frontend.task-model
        knowledge_kind: task-model
        requires: []
      - capability: experiment.frontend.user-journeys
        knowledge_kind: user-journey-design
        requires:
          - capability: experiment.frontend.task-model

  - id: HUMAN-INTERFACE-DESIGN
    responsibility: Own user-facing conceptual, information, interaction, topology, presentation and screen composition knowledge.
    boundary:
      semantic_cohesion: Human interaction and its presentation/view realization.
      independent_change: Human interface knowledge can change behind accepted task/application semantics.
      public_contract: Provides independently addressable interface knowledge to verification and realization consumers.
    produces:
      - capability: experiment.frontend.conceptual-model
        knowledge_kind: conceptual-interface-model
        semantic_claims: [engineering.interface.human.conceptual-model]
        requires:
          - capability: experiment.frontend.task-model
          - capability: experiment.frontend.user-journeys
      - capability: experiment.frontend.information-architecture
        knowledge_kind: information-architecture-design
        semantic_claims: [engineering.interface.human.information-architecture]
        requires:
          - capability: experiment.frontend.conceptual-model
          - capability: experiment.frontend.task-model
          - capability: experiment.frontend.user-journeys
      - capability: experiment.frontend.interaction
        knowledge_kind: interaction-design
        semantic_claims: [engineering.interface.human.interaction]
        requires:
          - capability: experiment.frontend.conceptual-model
          - capability: experiment.frontend.task-model
          - capability: experiment.frontend.user-journeys
      - capability: experiment.frontend.topology
        knowledge_kind: interface-topology-design
        semantic_claims: [engineering.interface.human.navigation-topology]
        requires:
          - capability: experiment.frontend.information-architecture
          - capability: experiment.frontend.interaction
      - capability: experiment.frontend.presentation-system
        knowledge_kind: presentation-system-design
        semantic_claims: [engineering.interface.human.presentation-system]
        requires:
          - capability: experiment.frontend.conceptual-model
          - capability: experiment.frontend.interaction
          - capability: experiment.frontend.topology
      - capability: experiment.frontend.screen-view
        knowledge_kind: screen-view-design
        semantic_claims: [engineering.interface.human.screen-composition]
        requires:
          - capability: experiment.frontend.topology
          - capability: experiment.frontend.interaction
          - capability: experiment.frontend.presentation-system

  - id: VERIFICATION-DESIGN
    responsibility: Own evidence proving accepted interface knowledge and later presentation realization.
    boundary:
      semantic_cohesion: Verification objectives and evidence.
      independent_change: Verification can evolve without owning interface semantics.
      public_contract: Provides early semantic/interface evidence and later screen/presentation evidence.
    produces:
      - capability: experiment.frontend.interface-verification
        knowledge_kind: verification-strategy
        requires:
          - capability: experiment.frontend.task-model
          - capability: experiment.frontend.information-architecture
          - capability: experiment.frontend.interaction
          - capability: experiment.frontend.topology
      - capability: experiment.frontend.presentation-verification
        knowledge_kind: verification-strategy
        requires:
          - capability: experiment.frontend.interface-verification
          - capability: experiment.frontend.presentation-system
          - capability: experiment.frontend.screen-view

  - id: IMPLEMENTATION-DESIGN
    responsibility: Own implementation planning after frontend design and verification closure.
    boundary:
      semantic_cohesion: Realization slicing.
      independent_change: Implementation sequencing can change behind stable design.
      public_contract: Provides an implementation plan without inventing UX.
    produces:
      - capability: experiment.frontend.implementation-plan
        knowledge_kind: implementation-design
        requires:
          - capability: experiment.frontend.presentation-verification

consumers:
  - id: FRONTEND-IMPLEMENTATION
    purpose: Implement without inventing conceptual, IA, interaction, topology or screen decisions.
    requires:
      - capability: experiment.frontend.implementation-plan
