version: 1
kind: presentation-system-design
id: EXAMPLE-PRESENTATION-SYSTEM
status: CURRENT

scope: user-facing application

external_baseline:
  provider: example-ui
  artifact: detail-template
  version: 1.0.0
  feature_policy:
    default: deny

principles:
  hierarchy: One clear task context and primary action role per view.
  consistency: Equivalent actions and states use equivalent reusable patterns.
  density: Comfortable default; denser local composition requires rationale.

patterns:
  DETAIL:
    regions: [context, primary-content, actions, secondary-content]
    features: [show-primary, show-history, edit, delete]
  FORM:
    features: [edit, submit, cancel]
    rules: [labels-before-controls, field-errors-near-fields, error-summary-on-rejection]
  STATUS:
    features: [loading, empty, error]
    rules: [semantic-text-not-color-only, non-modal-for-routine-status]

responsive:
  preserve: [information, actions, semantic-order]

accessibility_defaults:
  - visible focus
  - keyboard reachable actions
  - semantic status/error presentation

deviation_policy:
  require_rationale: true

implementation_freedom:
  - css layout mechanism
  - frontend framework
  - private component decomposition
