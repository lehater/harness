version: 1
kind: harness-authority-catalog
id: SOFTWARE-PRODUCT-REFERENCE-V0
status: experimental

principles:
  atomicity_test:
    - semantic_cohesion
    - independent_change
    - public_contract
  notes:
    - An Authority owns a coherent kind of engineering decision, not a stage, team, document or domain subject.
    - Catalog entries are reference boundaries. A project instantiates only applicable Authorities and must justify merges or splits with the same atomicity test.
    - Applicability changes the graph shape; it does not create workflow stages.
    - A project-specific Authority is valid when its decision boundary cannot be represented coherently by the reference catalog.

authorities:
  - id: DISCOVERY
    class: baseline
    responsibility: Own problem observations, actors, desired outcomes and motivating evidence without deciding product requirements or solution semantics.
    boundary:
      semantic_cohesion: Evidence and observations about the problem space.
      independent_change: Evidence can be refined before accepted product requirements change.
      public_contract: Provides accepted problem evidence and unresolved discovery questions.
    split_when:
      - Independent evidence domains have different decision owners and public consumers.
    merge_guidance: May be merged with PRODUCT-REQUIREMENTS only when problem evidence is trivial and has no independent lifecycle or provenance value.

  - id: PRODUCT-REQUIREMENTS
    class: baseline
    responsibility: Own accepted product intent, scope, externally observable behavior, constraints and acceptance expectations.
    boundary:
      semantic_cohesion: Decisions about what the product must achieve.
      independent_change: Product intent can change without directly deciding domain or technical realization.
      public_contract: Provides accepted behavioral and acceptance semantics to downstream design.
    split_when:
      - Product policy and externally observable requirements have independent owners or change lifecycles.

  - id: STRATEGIC-DOMAIN-DESIGN
    class: conditional
    applies_when: The product has non-trivial semantic ownership boundaries, multiple domain capabilities or independent domain lifecycles.
    responsibility: Own semantic decomposition, domain responsibility boundaries and relationships between independently modeled domain areas.
    boundary:
      semantic_cohesion: Decisions about domain partitioning and public semantic relationships.
      independent_change: Strategic decomposition can evolve without directly selecting tactical structures or technical architecture.
      public_contract: Provides accepted semantic ownership boundaries and context relationships.
    merge_guidance: For a simple domain with one coherent semantic owner, this may collapse into a single DOMAIN-DESIGN Authority.

  - id: DOMAIN-USE-CASE-DESIGN
    class: conditional
    applies_when: Observable domain behavior needs an explicit stable contract before tactical modeling.
    responsibility: Own domain-focused use-case behavior without deciding internal tactical structures or technical transport.
    boundary:
      semantic_cohesion: Observable domain behavior for bounded problem slices.
      independent_change: Use-case behavior can be refined before tactical identities, invariants or persistence are selected.
      public_contract: Provides accepted domain behavior to tactical modeling and application composition.
    merge_guidance: May be absorbed by PRODUCT-REQUIREMENTS or TACTICAL-DOMAIN-DESIGN when no independently valuable use-case contract exists.

  - id: TACTICAL-DOMAIN-DESIGN
    class: conditional
    applies_when: Domain identities, lifecycles, invariants or domain operations carry non-trivial semantics.
    responsibility: Own tactical domain language, identities, lifecycles, invariants, decisions and public domain semantics.
    boundary:
      semantic_cohesion: Decisions about how accepted domain behavior is modeled semantically.
      independent_change: Tactical semantics can evolve behind stable strategic/use-case contracts without selecting storage or transport.
      public_contract: Provides accepted tactical domain semantics to application and technical design.
    merge_guidance: For transactionally simple products without meaningful domain invariants, a lighter DOMAIN-DESIGN Authority may be sufficient.

  - id: APPLICATION-DESIGN
    class: conditional
    applies_when: The product has cross-capability workflows, orchestration, journeys or application-level materialization semantics.
    responsibility: Own application-level composition of accepted domain/product behavior.
    boundary:
      semantic_cohesion: Decisions about orchestration across domain responsibilities and user/system journeys.
      independent_change: Application composition can evolve without re-owning underlying domain truth or technical architecture.
      public_contract: Provides accepted application flows and orchestration semantics.

  - id: SYSTEM-ARCHITECTURE
    class: baseline
    responsibility: Own system structure, runtime boundaries, dependency/consistency rules and technical interaction topology.
    boundary:
      semantic_cohesion: Structural and runtime decisions that constrain implementation.
      independent_change: Architecture can evolve behind stable product/domain contracts without changing their semantic ownership.
      public_contract: Provides accepted system topology and architectural constraints.

  - id: SECURITY-ARCHITECTURE
    class: conditional
    applies_when: Security-specific trust, identity, admission, protection or enforcement structure requires decisions independent of general architecture or product/domain semantics.
    responsibility: Own security-specific trust, identity, admission, protection and enforcement structure derived from accepted product, domain and system truth.
    boundary:
      semantic_cohesion: Decisions about security trust boundaries, trusted identity, credential/session protection, admission and enforcement structure.
      independent_change: Security architecture can evolve independently from product/domain entitlement semantics, interface representation and later threat analysis.
      public_contract: Provides accepted security constraints to system/interface/data/component/operability/verification/implementation consumers without re-owning their semantics.
    merge_guidance: May stay inside SYSTEM-ARCHITECTURE when security decisions are simple and have no independent lifecycle or public consumers. Security concerns alone do not require this Authority; a local/trusted runtime may need SECURITY-ANALYSIS without a separate SECURITY-ARCHITECTURE instance.

  - id: INTERFACE-DESIGN
    class: conditional
    applies_when: The system exposes machine or human interfaces whose representation/interaction decisions need independent ownership.
    responsibility: Own supported external interface contracts and shared technical representations.
    boundary:
      semantic_cohesion: Decisions about external interaction and representation.
      independent_change: Interface contracts can evolve while preserving accepted domain/product semantics.
      public_contract: Provides canonical machine/user interface contracts.

  - id: DATA-DESIGN
    class: conditional
    applies_when: Persistence topology, schema constraints or storage representations carry independent engineering decisions.
    responsibility: Own physical persistence and storage representation.
    boundary:
      semantic_cohesion: Decisions about durable physical data representation and constraints.
      independent_change: Storage design can evolve behind stable domain/application contracts.
      public_contract: Provides accepted persistence model and storage constraints.
    merge_guidance: May stay inside SYSTEM-ARCHITECTURE for simple persistence with no independent constraints.

  - id: QUALITY-DESIGN
    class: conditional
    applies_when: Architecture-significant performance, availability, scale, consistency or other quality constraints require explicit decisions.
    responsibility: Own explicit realization quality constraints derived from accepted product/design truth.
    boundary:
      semantic_cohesion: Cross-cutting non-functional constraints on realization.
      independent_change: Quality constraints can evolve without reallocating semantic ownership.
      public_contract: Provides measurable or explicitly unresolved quality constraints to architecture, implementation and verification.
    merge_guidance: Simple quality expectations may remain PRODUCT-REQUIREMENTS when they do not need independent design work.

  - id: SECURITY-ANALYSIS
    class: conditional
    applies_when: Threat/control/applicability analysis is needed to establish security coverage or discover gaps against accepted design, including cases with no separate SECURITY-ARCHITECTURE instance.
    responsibility: Own threat, control and applicability coverage against accepted design and route material gaps to the Authority that owns their resolution.
    boundary:
      semantic_cohesion: Analysis of applicable threats, accepted controls, not-applicable/deferred concerns and unresolved security gaps against an accepted design baseline.
      independent_change: Threat knowledge and coverage can evolve without itself owning product/domain/security/system/interface/data decisions.
      public_contract: Provides security coverage evidence, verification obligations and blocking Questions; it never silently repairs missing upstream design.

  - id: OBLIGATION-ANALYSIS
    class: conditional
    applies_when: Material law, regulation, contract, license, organizational policy, platform mandate or another independently governed normative source must be traced into engineering decisions.
    responsibility: Own provenance, applicability and coverage of imposed normative obligations, derive and route constraints to their semantic owners, and expose unresolved interpretation or coverage as Questions without owning constrained semantics.
    boundary:
      semantic_cohesion: Normative-source identity, applicability, scoped interpretation, routed constraints, coverage state and reopening conditions.
      independent_change: Sources, versions, jurisdictions, contracts or applicability can change independently of downstream design.
      public_contract: Provides obligation/applicability coverage and routed constraints to semantic owners and verification consumers.
    merge_guidance: Omit when no material independently governed normative source applies; do not create generic COMPLIANCE-DESIGN, LEGAL-DESIGN or LICENSE-DESIGN.

  - id: CHANGE-TRANSITION-DESIGN
    class: conditional
    applies_when: Moving between accepted engineering states introduces material intermediate/coexistence states, ordering constraints, irreversible points, rollout gates, recovery choices or retirement conditions not fully derivable from endpoint designs.
    responsibility: Own validity of the transition between accepted engineering states without re-owning source-state or target-state semantics.
    boundary:
      semantic_cohesion: Permitted intermediate/coexistence states, transition ordering, compatibility windows, irreversible points, progression gates, recovery paths and retirement conditions.
      independent_change: Transition strategy can change while accepted source and target states remain stable and can survive changes in deployment/migration tooling.
      public_contract: Provides transition constraints to implementation, verification/test and operability while routing missing endpoint semantics to their owners.
    merge_guidance: Omit for trivial atomic replacement with no material intermediate state; deployment, release, migration and compatibility mechanisms alone do not justify separate Authorities.

  - id: OPERABILITY-DESIGN
    class: conditional
    applies_when: Runtime diagnosis, correlation, health, dependency visibility or operational evidence needs an independently valuable pre-code contract.
    responsibility: Own runtime evidence and diagnosability requirements derived from accepted product, architecture, interface, security and quality truth.
    boundary:
      semantic_cohesion: Decisions about what runtime evidence must exist so accepted behavior, lifecycle state and technical failure are diagnosable.
      independent_change: Operability evidence can evolve without redefining product/domain/interface semantics or selecting telemetry implementation mechanics.
      public_contract: Provides runtime evidence requirements to component, verification/test and implementation consumers while routing configuration, failure, security and reliability semantics to their owning Authorities.
    merge_guidance: May remain inside SYSTEM-ARCHITECTURE or VERIFICATION-DESIGN when runtime evidence has no independent lifecycle or public consumers. Logging, configuration and error handling are not sufficient reasons to instantiate this Authority.

  - id: ENGINEERING-POLICY
    class: conditional
    applies_when: The project selects cross-cutting engineering principles, architecture discipline or implementation-design constraints that must be normative across multiple design Authorities.
    responsibility: Own project-selected engineering design obligations and explicit anti-pattern constraints without owning the project semantics to which they apply.
    boundary:
      semantic_cohesion: Normative cross-cutting rules for how accepted engineering knowledge may be realized.
      independent_change: Engineering discipline can be refined without redefining product/domain semantics, while downstream realization may require reevaluation.
      public_contract: Provides reviewable engineering obligations to applicable design and implementation consumers.
    merge_guidance: May remain inside SYSTEM-ARCHITECTURE or organizational policy when the constraints have no independent project lifecycle. Principle names alone are not sufficient; accepted policy should state observable obligations.

  - id: COMPONENT-DESIGN
    class: conditional
    applies_when: Coding must be constrained by explicit component responsibilities, ports/contracts, dependency ownership, composition or mapping boundaries beyond system/application architecture.
    responsibility: Own implementation-facing component decomposition and dependency contracts without deciding implementation sequencing or private code structure.
    boundary:
      semantic_cohesion: Public component responsibilities, consumer/provider contracts, dependency direction, abstraction ownership and composition/mapping boundaries.
      independent_change: Component realization can evolve behind accepted architecture/application/interface contracts without changing their semantics.
      public_contract: Provides code-design boundaries sufficient for implementation agents to avoid inventing architecturally significant structure.
    merge_guidance: May remain inside APPLICATION-DESIGN or IMPLEMENTATION-DESIGN for simple systems where component structure has no independently valuable contract.

  - id: TEST-DESIGN
    class: conditional
    applies_when: Coding or test agents would otherwise need to invent material executable oracles, or accepted verification obligations need an independently valuable pre-code refinement into test contracts.
    responsibility: Own executable observable test contracts derived from accepted verification and semantic design without owning production semantics or concrete test-code mechanics.
    boundary:
      semantic_cohesion: Preconditions, controlled operations, observable oracles, invariants, state transitions, failure/atomicity distinctions and property/state-machine obligations.
      independent_change: Test contracts can survive changes in implementation slicing, code structure, frameworks and test mechanics while accepted behavior remains stable.
      public_contract: Provides traceable executable test semantics sufficient for test-first or implementation work without allowing tests to invent upstream truth.
    merge_guidance: May remain inside VERIFICATION-DESIGN when verification scenarios already specify executable preconditions/operations/oracles and have no independent lifecycle. TDD is not implied by this Authority.

  - id: IMPLEMENTATION-DESIGN
    class: baseline
    responsibility: Own implementation slicing, sequencing, repository realization, concrete toolchain/gate wiring, migration concerns and completion criteria after upstream engineering decisions are available.
    boundary:
      semantic_cohesion: Decisions about how accepted design will be realized as bounded implementation work and a reproducible physical codebase/toolchain.
      independent_change: Realization order, physical mapping and replaceable tools can change without redefining upstream truth when accepted boundaries and obligations remain satisfied.
      public_contract: Provides implementation plan, repository/tooling realization, quality-gate wiring and completion criteria while routing missing semantic decisions upstream.

  - id: VERIFICATION-DESIGN
    class: baseline
    responsibility: Own verification levels, traceability, scenarios and evidence proving implementation realizes accepted engineering knowledge.
    boundary:
      semantic_cohesion: Decisions about what executable or inspectable evidence proves accepted design.
      independent_change: Verification strategy can evolve without taking ownership of product/domain/architecture semantics.
      public_contract: Provides verification strategy and acceptance evidence; routes design gaps to owning Authorities.
